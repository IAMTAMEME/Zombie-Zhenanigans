<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival</title>
    <style>
        body {
            margin: 0;
            background-color: #1c1c1c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #2b3a2f; 
            display: block;
            cursor: crosshair;
        }
        /* Separated and organized HUD items */
        #hud-left {
            position: absolute;
            top: 20px;
            left: 25px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .hud-item {
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            letter-spacing: 0.5px;
        }
        #wave-display {
            color: #f1c40f; /* Distinct gold color for waves */
            font-size: 22px;
        }
        #kills-display {
            color: #ff4d4d; /* Distinct red color for kills */
        }
        #food-display {
            color: #2ecc71; /* Distinct green color for currency */
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #health-container {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 220px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(4px);
            overflow: hidden;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #2ecc71; 
            border-radius: 20px;
            transition: width 0.15s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        #instructions {
            margin-top: 20px;
            color: #888888;
            font-size: 15px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="850" height="650"></canvas>
        <div id="hud-left">
            <div id="wave-display" class="hud-item">Wave: 1</div>
            <div id="kills-display" class="hud-item">Kills: 0</div>
            <div id="food-display" class="hud-item">Food Cans: 0</div>
        </div>
        <div id="health-container">
            <div id="health-bar"></div>
        </div>
    </div>
    <div id="instructions">
        Move: [WASD / Arrows] &nbsp;|&nbsp; Shoot: [Left Click] &nbsp;|&nbsp; Restart: [R]
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// UI Elements
const waveDisplay = document.getElementById("wave-display");
const killsDisplay = document.getElementById("kills-display");
const foodDisplay = document.getElementById("food-display");
const healthBar = document.getElementById("health-bar");

// Game Engine Parameters
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 12,
    speed: 4.2,
    health: 100,
    kills: 0,
    foodCans: 0,
    lastShotTime: 0,
    shootCooldown: 140
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = [];
let items = []; // Drop system array
let wave = 1;
let zombiesToSpawn = 6;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 900;
let gameOver = false;

// Event Tracking Systems
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') resetGame();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Component Structuring Classes
class BloodParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2.5 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * force;
        this.vy = Math.sin(angle) * force;
        this.alpha = 1;
        this.decay = Math.random() * 0.04 + 0.02;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95; 
        this.vy *= 0.95;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class FoodCanItem {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 10;
        this.height = 14;
        this.bounceTimer = Math.random() * 100; // Offset for smooth floating animation
    }
    draw() {
        this.bounceTimer += 0.05;
        const bounceOffsetY = Math.sin(this.bounceTimer) * 3;

        ctx.save();
        ctx.translate(this.x, this.y + bounceOffsetY);

        // Modern, clean flat vector representation of a can
        ctx.fillStyle = "#bdc3c7"; // Tin color base
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        
        ctx.fillStyle = "#e74c3c"; // Mid label accent
        ctx.fillRect(-this.width/2, -this.height/6, this.width, this.height/3);

        ctx.restore();
    }
}

class ModernZombie {
    constructor() {
        const borderDist = 30;
        const edgeChoice = Math.floor(Math.random() * 4);
        
        if (edgeChoice === 0) { this.x = Math.random() * canvas.width; this.y = -borderDist; }
        else if (edgeChoice === 1) { this.x = Math.random() * canvas.width; this.y = canvas.height + borderDist; }
        else if (edgeChoice === 2) { this.x = -borderDist; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + borderDist; this.y = Math.random() * canvas.height; }

        this.radius = 11;
        this.health = 25 + (wave * 5);
        this.speed = 1.6 + Math.min(wave * 0.1, 1.4);
    }
    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist !== 0) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#4a6b52"; 
        ctx.fill();

        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(angle + 0.35) * 6, this.y + Math.sin(angle + 0.35) * 6, 2, 0, Math.PI * 2);
        ctx.arc(this.x + Math.cos(angle - 0.35) * 6, this.y + Math.sin(angle - 0.35) * 6, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

class ModernBullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.radius = 2.5;
        this.speed = 14;
        this.damage = 25;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);
        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }
    update() {
        this.x += this.dx;
        this.y += this.dy;
    }
    draw() {
        ctx.fillStyle = "#f1c40f"; 
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Logic Pipelines
function drawPlayer() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#3498db"; 
    ctx.fill();

    ctx.fillStyle = "#555555";
    ctx.fillRect(4, -2.5, 12, 5);

    ctx.restore();
}

function handleMovement() {
    let dx = 0;
    let dy = 0;

    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * player.speed));
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new ModernBullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new ModernZombie());
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }
    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 5;
        zombiesSpawned = 0;
        spawnDelay = Math.max(300, spawnDelay - 70);
    }
}

function checkCollisions() {
    // Bullet / Zombie collisions
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            const dist = Math.hypot(bullets[b].x - zombies[z].x, bullets[b].y - zombies[z].y);
            if (dist < (bullets[b].radius + zombies[z].radius)) {
                
                for (let i = 0; i < 5; i++) {
                    particles.push(new BloodParticle(zombies[z].x, zombies[z].y, "#c0392b"));
                }
                
                zombies[z].health -= bullets[b].damage;
                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    // 40% chance to drop a food can currency item upon death
                    if (Math.random() < 0.40) {
                        items.push(new FoodCanItem(zombies[z].x, zombies[z].y));
                    }
                    zombies.splice(z, 1);
                    player.kills++;
                }
                break;
            }
        }
    }

    // Item Collection processing loop
    for (let i = items.length - 1; i >= 0; i--) {
        const dist = Math.hypot(player.x - items[i].x, player.y - items[i].y);
        // Collision boundary check for item picking
        if (dist < (player.radius + items[i].width)) {
            player.foodCans++;
            items.splice(i, 1);
        }
    }

    // Zombie / Player collision
    for (let z = zombies.length - 1; z >= 0; z--) {
        const dist = Math.hypot(player.x - zombies[z].x, player.y - zombies[z].y);
        if (dist < (player.radius + zombies[z].radius)) {
            player.health -= 0.5;
            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }
}

function updateUI() {
    waveDisplay.innerText = `Wave: ${wave}`;
    killsDisplay.innerText = `Kills: ${player.kills}`;
    foodDisplay.innerText = `Food Cans: ${player.foodCans}`;
    
    healthBar.style.width = `${player.health}%`;
    
    if (player.health > 50) healthBar.style.backgroundColor = "#2ecc71";
    else if (player.health > 25) healthBar.style.backgroundColor = "#e67e22";
    else healthBar.style.backgroundColor = "#e74c3c";
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.kills = 0;
    player.foodCans = 0;
    wave = 1;
    zombiesToSpawn = 6;
    zombiesSpawned = 0;
    zombies = [];
    bullets = [];
    particles = [];
    items = [];
    gameOver = false;
}

function loop(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handleMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Items rendering
        items.forEach(item => item.draw());

        // Render Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
            }
        }

        // Render Zombies
        zombies.forEach(zombie => {
            zombie.update();
            zombie.draw();
        });

        drawPlayer();
    } else {
        ctx.fillStyle = "rgba(20, 20, 20, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "600 36px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 40);
        
        ctx.font = "16px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#aaaaaa";
        ctx.fillText(`Wave Reached: ${wave}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText(`Total Kills: ${player.kills}`, canvas.width / 2, canvas.height / 2 + 35);
        ctx.fillText(`Food Cans Salvaged: ${player.foodCans}`, canvas.width / 2, canvas.height / 2 + 60);
        ctx.fillText("Press 'R' to play again", canvas.width / 2, canvas.height / 2 + 110);
    }

    // Particle Handling Animation
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    updateUI();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
