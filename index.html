<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Zhenanigans</title>

<style>
body {
    margin: 0;
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
}

#ui {
    width: 800px;
    display: flex;
    justify-content: space-between;
    margin: 15px;
    font-size: 22px;
    font-weight: bold;
}

#game-container {
    position: relative;
}

canvas {
    background: #1a1a1a;
    border: 4px solid #333;
}

#health-container {
    width: 200px;
    height: 20px;
    background: #444;
    border: 2px solid #666;
}

#health-bar {
    width: 100%;
    height: 100%;
    background: #00ff66;
}

#gameover {
    display: none;
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 48px;
    color: red;
    font-weight: bold;
}

#restart {
    padding: 10px 20px;
    font-size: 18px;
}

#hack-trigger-btn {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: #222;
    color: #777;
    border: 1px solid #444;
    cursor: pointer;
}

#cheat-menu {
    display: none;
    position: absolute;
    top: 50px;
    left: 240px;
    width: 320px;
    background: rgba(20,20,20,0.95);
    border: 3px solid #ff0055;
    padding: 15px;
    z-index: 10;
}

.cheat-item {
    margin: 12px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cheat-btn {
    background: #ff0055;
    color: white;
    border: none;
    padding: 4px 10px;
    cursor: pointer;
}

.cheat-input {
    width: 60px;
}

.cheat-close-btn {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div id="ui">
    <div>Wave: <span id="wave">0</span></div>

    <div style="display:flex;align-items:center;">
        HP:
        <div id="health-container">
            <div id="health-bar"></div>
        </div>
    </div>

    <div>🥫 <span id="foodCans">0</span></div>
</div>

<div id="game-container">

<canvas id="gameCanvas" width="800" height="600"></canvas>

<button id="hack-trigger-btn" onclick="tryOpenHacks()">????</button>

<div id="gameover">
    GAME OVER
    <br><br>
    <button id="restart" onclick="resetGame()">Restart</button>
</div>

<div id="cheat-menu">

    <h2 style="text-align:center;color:#ff0055;">
        MOD MENU
    </h2>

    <div class="cheat-item">
        <label>Wave:</label>
        <div>
            <input type="number" id="cheat-wave-num" class="cheat-input" value="1">
            <button class="cheat-btn" onclick="cheatSetWave()">Set</button>
        </div>
    </div>

    <div class="cheat-item">
        <label>Triggerbot:</label>
        <input type="checkbox" onchange="toggleTriggerbot(this.checked)">
    </div>

    <div class="cheat-item">
        <label>Godmode:</label>
        <input type="checkbox" onchange="toggleInvisibility(this.checked)">
    </div>

    <div class="cheat-item">
        <label>Add 100 Cans:</label>
        <button class="cheat-btn" onclick="cheatGiveCans()">+100</button>
    </div>

    <div class="cheat-item">
        <label>Speed:</label>
        <input type="range" min="1" max="20" value="4"
        oninput="setPlayerSpeed(this.value)">
    </div>

    <div class="cheat-item">
        <label>No Cooldown:</label>
        <input type="checkbox"
        onchange="toggleNoCooldown(this.checked)">
    </div>

    <div class="cheat-item">
        <label>Health:</label>
        <input type="range" min="1" max="1000" value="100"
        oninput="setPlayerHealth(this.value)">
    </div>

    <div class="cheat-item">
        <label>Damage:</label>
        <input type="range" min="1" max="100" value="1"
        oninput="setBulletDamage(this.value)">
    </div>

    <button class="cheat-close-btn" onclick="closeCheatMenu()">
        Close
    </button>

</div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const foodCansEl = document.getElementById("foodCans");
const waveEl = document.getElementById("wave");
const healthBarEl = document.getElementById("health-bar");
const gameoverEl = document.getElementById("gameover");
const cheatMenuEl = document.getElementById("cheat-menu");

let player = {
    x: 400,
    y: 300,
    size: 20,
    speed: 4,
    angle: 0,
    maxHp: 100,
    hp: 100
};

let bullets = [];
let zombies = [];

let keys = {};

let mouse = {
    x: 0,
    y: 0
};

let foodCans = 0;
let currentWave = 0;
let gameOver = false;

let shootCooldown = 500;
let lastShootTime = 0;

let bulletSize = 4;

let noCooldownActive = false;
let bulletDamage = 1;

let hackTriggerbotActive = false;
let hackInvisibilityActive = false;

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();

    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", () => {
    if(!gameOver) shoot();
});

function shoot() {

    const currentTime = performance.now();

    if (
        noCooldownActive ||
        currentTime - lastShootTime >= shootCooldown
    ) {

        let dx = mouse.x - player.x;
        let dy = mouse.y - player.y;

        let angle = Math.atan2(dy, dx);

        bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 8,
            vy: Math.sin(angle) * 8,
            size: bulletSize,
            damage: bulletDamage
        });

        lastShootTime = currentTime;
    }
}

function spawnZombie() {

    let x, y;

    if(Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
    }

    zombies.push({
        x,
        y,
        size: 16,
        speed: 1.5,
        angle: 0,
        hp: 3 + currentWave
    });
}

function startWave() {

    currentWave++;

    waveEl.innerText = currentWave;

    for(let i = 0; i < currentWave * 3; i++) {
        spawnZombie();
    }
}

function tryOpenHacks() {

    let pass = prompt("Enter Secret Code:");

    if(pass === "0000") {
        cheatMenuEl.style.display = "block";
    } else {
        alert("ACCESS DENIED");
    }
}

function closeCheatMenu() {
    cheatMenuEl.style.display = "none";
}

function cheatSetWave() {

    let val = parseInt(
        document.getElementById("cheat-wave-num").value
    );

    if(!isNaN(val) && val > 0) {

        currentWave = val - 1;

        zombies = [];

        startWave();
    }
}

function toggleTriggerbot(v) {
    hackTriggerbotActive = v;
}

function toggleInvisibility(v) {
    hackInvisibilityActive = v;
}

function cheatGiveCans() {

    foodCans += 100;

    foodCansEl.innerText = foodCans;
}

function setPlayerSpeed(v) {
    player.speed = parseFloat(v);
}

function toggleNoCooldown(v) {
    noCooldownActive = v;
}

function setPlayerHealth(v) {

    player.maxHp = parseInt(v);
    player.hp = parseInt(v);

    updateHealthBar();
}

function setBulletDamage(v) {
    bulletDamage = parseInt(v);
}

function updateHealthBar() {

    let hpPercent =
        (player.hp / player.maxHp) * 100;

    healthBarEl.style.width =
        hpPercent + "%";
}

function update() {

    if(gameOver) return;

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    player.x = Math.max(
        player.size,
        Math.min(canvas.width - player.size, player.x)
    );

    player.y = Math.max(
        player.size,
        Math.min(canvas.height - player.size, player.y)
    );

    player.angle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

    if(zombies.length === 0) {
        startWave();
    }

    if(hackTriggerbotActive && zombies.length > 0) {

        let z = zombies[0];

        mouse.x = z.x;
        mouse.y = z.y;

        shoot();
    }

    bullets.forEach(b => {

        b.x += b.vx;
        b.y += b.vy;
    });

    for(let i = zombies.length - 1; i >= 0; i--) {

        let z = zombies[i];

        let dx = player.x - z.x;
        let dy = player.y - z.y;

        let dist = Math.hypot(dx, dy);

        z.x += (dx / dist) * z.speed;
        z.y += (dy / dist) * z.speed;

        if(dist < player.size + z.size) {

            if(!hackInvisibilityActive) {

                player.hp -= 1;

                updateHealthBar();

                if(player.hp <= 0) {

                    gameOver = true;

                    gameoverEl.style.display = "block";
                }
            }
        }

        for(let j = bullets.length - 1; j >= 0; j--) {

            let b = bullets[j];

            let d =
                Math.hypot(
                    b.x - z.x,
                    b.y - z.y
                );

            if(d < z.size + b.size) {

                z.hp -= b.damage;

                bullets.splice(j, 1);

                if(z.hp <= 0) {

                    zombies.splice(i, 1);

                    foodCans++;

                    foodCansEl.innerText = foodCans;
                }

                break;
            }
        }
    }
}

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.rotate(player.angle);

    ctx.fillStyle =
        hackInvisibilityActive
        ? "rgba(50,150,255,0.4)"
        : "#3388ff";

    ctx.beginPath();

    ctx.arc(0,0,player.size,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle = "#555";

    ctx.fillRect(0,-4,25,8);

    ctx.restore();

    ctx.fillStyle = "#ffcc00";

    bullets.forEach(b => {

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    zombies.forEach(z => {

        ctx.fillStyle = "green";

        ctx.beginPath();

        ctx.arc(
            z.x,
            z.y,
            z.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });
}

function loop() {

    update();

    render();

    requestAnimationFrame(loop);
}

function resetGame() {

    player.hp = 100;
    player.maxHp = 100;
    player.speed = 4;

    bullets = [];
    zombies = [];

    foodCans = 0;
    currentWave = 0;

    gameOver = false;

    shootCooldown = 500;

    bulletDamage = 1;

    noCooldownActive = false;

    hackTriggerbotActive = false;
    hackInvisibilityActive = false;

    foodCansEl.innerText = 0;
    waveEl.innerText = 0;

    updateHealthBar();

    gameoverEl.style.display = "none";

    closeCheatMenu();
}

requestAnimationFrame(loop);

</script>

</body>
</html>
