<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Zhenanigans</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .stat { font-size: 24px; text-shadow: 2px 2px #cc0000; margin-bottom: 5px; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; }
        button { padding: 10px 20px; font-size: 20px; cursor: pointer; background: #cc0000; border: none; color: white; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">Health: <span id="health">100</span>%</div>
    </div>
    <div id="msg">
        <h1 style="font-size: 60px; color: #cc0000;">GAME OVER</h1>
        <p id="finalScore"></p>
        <button onclick="location.reload()">RETRY</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const healthEl = document.getElementById('health');
        const msgEl = document.getElementById('msg');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let health = 100;
        let gameActive = true;

        const player = { x: canvas.width / 2, y: canvas.height / 2, radius: 25 };
        const projectiles = [];
        const enemies = [];

        class Enemy {
            constructor() {
                const radius = 20;
                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.speed = 1.5 + (score / 200);
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#4CAF50';
                ctx.fill();
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - 5, this.y - 5, 3, 3);
                ctx.fillRect(this.x + 2, this.y - 5, 3, 3);
            }
            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            const angle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
            projectiles.push({
                x: player.x, y: player.y,
                vX: Math.cos(angle) * 8,
                vY: Math.sin(angle) * 8
            });
        });

        function spawn() {
            if (gameActive) {
                enemies.push(new Enemy());
                setTimeout(spawn, Math.max(300, 1000 - (score * 2)));
            }
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#2196F3';
            ctx.fill();

            projectiles.forEach((p, i) => {
                p.x += p.vX;
                p.y += p.vY;
                ctx.fillStyle = '#FFEB3B';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) projectiles.splice(i, 1);
            });

            enemies.forEach((en, i) => {
                en.update();
                en.draw();

                if (Math.hypot(player.x - en.x, player.y - en.y) < player.radius + en.radius) {
                    health -= 0.5;
                    healthEl.innerText = Math.ceil(health);
                    if (health <= 0) {
                        gameActive = false;
                        document.getElementById('finalScore').innerText = "Zombies Slain: " + score;
                        msgEl.style.display = 'block';
                    }
                }

                projectiles.forEach((p, pi) => {
                    if (Math.hypot(p.x - en.x, p.y - en.y) < en.radius) {
                        enemies.splice(i, 1);
                        projectiles.splice(pi, 1);
                        score += 10;
                        scoreEl.innerText = score;
                    }
                });
            });
        }

        spawn();
        animate();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        });
    </script>
</body>
</html>
