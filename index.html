<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Zombie Zhenanigans</title> 
    <style> 
        body { 
            margin: 0; 
            background-color: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        } 
        #ui { 
            margin-bottom: 20px; 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            text-align: center; 
            width: 800px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 10px; 
        } 
        .hp-label { 
            margin-right: 12px; 
            letter-spacing: 1px; 
        } 
        #health-container { 
            width: 200px; 
            height: 20px; 
            background-color: #444; 
            border: 2px solid #555; 
            border-radius: 3px; 
            overflow: hidden; 
        } 
        #health-bar { 
            width: 100%; 
            height: 100%; 
            background-color: #00ff66; 
            transition: width 0.1s ease; 
        } 
        #game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            position: relative;
        }
        canvas { 
            background-color: #1a1a1a; 
            border: 4px solid #333; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); 
            cursor: crosshair; 
        } 
        #shop-panel {
            width: 220px;
            background: #222;
            border: 4px solid #444;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .shop-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            text-align: center;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }
        .shop-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .shop-item-info {
            font-size: 13px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }
        .shop-btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 6px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            transition: background 0.2s;
        }
        .shop-btn:hover {
            background: #0052cc;
        }
        .shop-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        #gameover { 
            display: none; 
            position: absolute; 
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px; 
            color: #ff3333; 
            font-weight: bold; 
            text-shadow: 2px 2px #000; 
            text-align: center; 
            line-height: 1.6; 
            background: rgba(17, 17, 17, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff3333;
            z-index: 10;
        } 
        #restart { 
            margin-top: 25px; 
            padding: 12px 24px; 
            font-size: 18px; 
            background: #ff3333; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 5px; 
            letter-spacing: 1px; 
        } 
        #wave-banner { 
            position: absolute; 
            left: 35%;
            top: 45%;
            font-size: 64px; 
            color: #ffcc00; 
            font-weight: bold; 
            text-shadow: 3px 3px #000; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            pointer-events: none; 
            letter-spacing: 4px; 
            z-index: 5;
        } 
    </style> 
</head> 
<body> 
    <div id="ui"> 
        <div>ZOMBIE ZHENANIGANS</div> 
        <div style="display: flex; align-items: center;"> 
            <span class="hp-label">HP:</span> 
            <div id="health-container"><div id="health-bar"></div></div> 
        </div> 
        <div>Wave: <span id="wave">0</span></div> 
        <div>Food-cans: 🥫 <span id="foodCans">0</span></div> 
    </div> 

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas> 

        <div id="shop-panel">
            <div class="shop-title">🥫 SURVIVAL SHOP</div>
            
            <div class="shop-item">
                <div class="shop-item-info"><span>+10 Max HP</span> <span id="cost-hp">Cost: 5</span></div>
                <button class="shop-btn" id="btn-hp" onclick="buyUpgrade('hp')">Upgrade Health</button>
            </div>

            <div class="shop-item">
                <div class="shop-item-info"><span>+0.5 Speed</span> <span id="cost-speed">Cost: 8</span></div>
                <button class="shop-btn" id="btn-speed" onclick="buyUpgrade('speed')">Upgrade Speed</button>
            </div>

            <div class="shop-item">
                <div class="shop-item-info"><span>-50ms Fire Rate</span> <span id="cost-firerate">Cost: 10</span></div>
                <button class="shop-btn" id="btn-firerate" onclick="buyUpgrade('firerate')">Upgrade Gun</button>
            </div>
            
            <div style="font-size: 11px; color: #777; text-align: center; margin-top: 5px;">
                Upgrades apply instantly!
            </div>
        </div>

        <div id="wave-banner">WAVE 1</div> 
        <div id="gameover"> 
            GAME OVER <br> 
            <button id="restart" onclick="resetGame()">Try Again</button> 
        </div> 
    </div>

    <script> 
        const canvas = document.getElementById("gameCanvas"); 
        const ctx = canvas.getContext("2d"); 
        const foodCansEl = document.getElementById("foodCans"); 
        const waveEl = document.getElementById("wave"); 
        const healthBarEl = document.getElementById("health-bar"); 
        const gameoverEl = document.getElementById("gameover"); 
        const waveBanner = document.getElementById("wave-banner"); 

        // Game State 
        let player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 }; 
        let bullets = []; 
        let zombies = []; 
        let keys = {}; 
        let mouse = { x: 0, y: 0 }; 
        let isMouseDown = false; 
        let foodCans = 0; 
        let gameOver = false; 

        // Upgrade Management
        let shootCooldown = 500; 
        let lastShootTime = 0; 
        let costs = { hp: 5, speed: 8, firerate: 10 };

        let currentWave = 0; 
        let waveState = "READY_TO_START"; 
        let waveTimer = 0;

        let lastHitTime = 0; 
        const hitCooldown = 400; 

        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true); 
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false); 

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect(); 
            mouse.x = e.clientX - rect.left; 
            mouse.y = e.clientY - rect.top; 
        }); 

        canvas.addEventListener("mousedown", () => isMouseDown = true); 
        window.addEventListener("mouseup", () => isMouseDown = false); 

        function shoot() { 
            const currentTime = performance.now(); 
            if (currentTime - lastShootTime >= shootCooldown) {
                const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
                bullets.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(angle) * 8,
                    vy: Math.sin(angle) * 8,
                    size: 4
                });
                lastShootTime = currentTime;
            }
        } 

        function startWave() {
            currentWave++;
            waveEl.innerText = currentWave;
            waveBanner.innerText = "WAVE " + currentWave;
            waveBanner.style.opacity = 1;
            waveState = "BANNER_DISPLAY";
            waveTimer = performance.now();

            const spawnCount = 3 + currentWave * 2;
            for (let i = 0; i < spawnCount; i++) {
                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? -40 : canvas.width + 40;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? -40 : canvas.height + 40;
                }
                
                // Random scar paths uniquely applied per box instance
                let scarOffset = Math.random() * 6 - 3;

                zombies.push({
                    x: x,
                    y: y,
                    speed: 1 + Math.random() * 0.8 + (currentWave * 0.1),
                    hp: 10 + (currentWave * 5),
                    size: 32, // Perfect diameter bounding square box size
                    scarSeed: scarOffset
                });
            }
        }

        // REPAIRED SHOP ENGINE FUNCTION
        function buyUpgrade(type) {
            if (foodCans >= costs[type]) {
                foodCans -= costs[type];
                foodCansEl.innerText = foodCans;

                if (type === 'hp') {
                    player.maxHp += 10;
                    player.hp = Math.min(player.maxHp, player.hp + 10);
                    costs.hp = Math.round(costs.hp * 1.5);
                    document.getElementById("cost-hp").innerText = "Cost: " + costs.hp;
                } else if (type === 'speed') {
                    player.speed += 0.5;
                    costs.speed = Math.round(costs.speed * 1.6);
                    document.getElementById("cost-speed").innerText = "Cost: " + costs.speed;
                } else if (type === 'firerate') {
                    shootCooldown = Math.max(100, shootCooldown - 50);
                    costs.firerate = Math.round(costs.firerate * 1.7);
                    if (shootCooldown <= 100) {
                        document.getElementById("cost-firerate").innerText = "MAXED";
                    } else {
                        document.getElementById("cost-firerate").innerText = "Cost: " + costs.firerate;
                    }
                }
                updateUI();
            }
        }

        function updateUI() {
            const healthPct = Math.max(0, (player.hp / player.maxHp) * 100);
            healthBarEl.style.width = healthPct + "%";
            
            document.getElementById("btn-hp").disabled = (foodCans < costs.hp);
            document.getElementById("btn-speed").disabled = (foodCans < costs.speed);
            document.getElementById("btn-firerate").disabled = (foodCans < costs.firerate || shootCooldown <= 100);
        }

        function resetGame() {
            player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 }; 
            bullets = []; 
            zombies = []; 
            foodCans = 0; 
            shootCooldown = 500;
            costs = { hp: 5, speed: 8, firerate: 10 };
            currentWave = 0;
            waveState = "READY_TO_START";
            gameOver = false;
            
            foodCansEl.innerText = foodCans;
            gameoverEl.style.display = "none";
            document.getElementById("cost-hp").innerText = "Cost: 5";
            document.getElementById("cost-speed").innerText = "Cost: 8";
            document.getElementById("cost-firerate").innerText = "Cost: 10";
            
            updateUI();
        }

        function update() {
            if (gameOver) return;

            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            if (isMouseDown) shoot();

            let dx = 0;
            let dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x + dx * player.speed));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y + dy * player.speed));

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            const now = performance.now();
            if (waveState === "READY_TO_START") {
                startWave();
            } else if (waveState === "BANNER_DISPLAY" && now - waveTimer > 1500) {
                waveBanner.style.opacity = 0;
                waveState = "FIGHTING";
            } else if (waveState === "FIGHTING" && zombies.length === 0) {
                waveState = "READY_TO_START";
            }

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                let zAngle = Math.atan2(player.y - z.y, player.x - z.x);
                z.x += Math.cos(zAngle) * z.speed;
                z.y += Math.sin(zAngle) * z.speed;

                // Precision Bounding Calculation for New Box Model
                let distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
                if (distToPlayer < player.size + (z.size / 1.4)) {
                    if (now - lastHitTime >= hitCooldown) {
                        player.hp -= 15;
                        lastHitTime = now;
                        updateUI();
                        if (player.hp <= 0) {
                            gameOver = true;
                            gameoverEl.style.display = "block";
                        }
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let distToBullet = Math.hypot(b.x - z.x, b.y - z.y);
                    if (distToBullet < (z.size / 1.4) + b.size) {
                        z.hp -= 10;
                        bullets.splice(j, 1);
                        if (z.hp <= 0) {
                            zombies.splice(i, 1);
                            foodCans++;
                            foodCansEl.innerText = foodCans;
                            break;
                        }
                    }
                }
            }
            updateUI(); 
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Bullets
            ctx.fillStyle = "#ffcc00";
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = "#0066ff";
            ctx.beginPath();
            ctx.arc(0, 0, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#333";
            ctx.fillRect(0, -5, player.size + 10, 10);
            ctx.restore();

            // FIXED: NEW CUBE ZOMBIE SPRITE ARCHITECTURE WITH GLOWING RED EYES & SCARS
            zombies.forEach(z => {
                ctx.save();
                ctx.translate(z.x, z.y);
                
                // Track orientation towards the player
                let faceAngle = Math.atan2(player.y - z.y, player.x - z.x);
                ctx.rotate(faceAngle);

                // 1. Draw Core Cube Base Body
                ctx.fillStyle = "#557a46"; // Zombie Green
                ctx.strokeStyle = "#38512f"; // Dark trim contour
                ctx.lineWidth = 3;
                ctx.fillRect(-z.size / 2, -z.size / 2, z.size, z.size);
                ctx.strokeRect(-z.size / 2, -z.size / 2, z.size, z.size);

                // 2. Draw Battle Scar Overlays
                ctx.strokeStyle = "#990000"; // Deep blood red scar cuts
                ctx.lineWidth = 2;
                
                // Slanted primary face scar
                ctx.beginPath();
                ctx.moveTo(-6 + z.scarSeed, -12);
                ctx.lineTo(4 + z.scarSeed, -2);
                ctx.stroke();

                // Cross-hatch stitch details on scar
                ctx.beginPath();
                ctx.moveTo(-4 + z.scarSeed, -9); ctx.lineTo(-1 + z.scarSeed, -11);
                ctx.moveTo(-1 + z.scarSeed, -5); ctx.lineTo(2 + z.scarSeed, -7);
                ctx.stroke();

                // 3. Draw 2 Angry Glowing Red Eyes
                ctx.fillStyle = "#ff0000"; // Pure emissive red
                ctx.shadowColor = "#ff0000";
                ctx.shadowBlur = 6; // Glow radius effect

                // Left Eye (oriented pointing forward right)
                ctx.fillRect(4, -9, 5, 4);
                // Right Eye
                ctx.fillRect(4, 5, 5, 4);
                
                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        updateUI();
        loop();
    </script>
</body>
</html>
