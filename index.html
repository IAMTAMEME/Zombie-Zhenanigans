<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival - Fixed Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #1c1c1c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #2b3a2f; 
            display: block;
            cursor: crosshair;
        }
        #hud-left {
            position: absolute;
            top: 20px;
            left: 25px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            user-select: none;
        }
        .hud-item {
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
        #wave-display { color: #f1c40f; font-size: 22px; }
        #kills-display { color: #ff4d4d; }
        #food-display { color: #2ecc71; }
        
        #health-container {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 220px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(4px);
            overflow: hidden;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #2ecc71; 
            border-radius: 20px;
            transition: width 0.1s linear;
        }
        #instructions {
            margin-top: 20px;
            color: #888888;
            font-size: 15px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="850" height="650"></canvas>
        <div id="hud-left">
            <div id="wave-display" class="hud-item">Wave: 1</div>
            <div id="kills-display" class="hud-item">Kills: 0</div>
            <div id="food-display" class="hud-item">Food Cans: 0</div>
        </div>
        <div id="health-container">
            <div id="health-bar"></div>
        </div>
    </div>
    <div id="instructions">
        Move: [WASD / Arrows] &nbsp;|&nbsp; Shoot: [Left Click] &nbsp;|&nbsp; Restart: [R]
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Grab and verify DOM components securely
const waveDisplay = document.getElementById("wave-display");
const killsDisplay = document.getElementById("kills-display");
const foodDisplay = document.getElementById("food-display");
const healthBar = document.getElementById("health-bar");

// Core Setup State
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 12,
    speed: 4.2,
    health: 100,
    kills: 0,
    foodCans: 0,
    lastShotTime: 0,
    shootCooldown: 140
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = [];
let items = []; 
let wave = 1;
let zombiesToSpawn = 6;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 900;
let gameOver = false;

// Global Event Window Mapping
window.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    keys[key] = true;
    if (gameOver && key === 'r') resetGame();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Logic Classes
class SplatParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2.5 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * force;
        this.vy = Math.sin(angle) * force;
        this.alpha = 1;
        this.decay = Math.random() * 0.04 + 0.02;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95; 
        this.vy *= 0.95;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class FoodCanItem {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 10;
        this.height = 14;
        this.bounceTimer = Math.random() * 100;
        this.markedForDelete = false;
    }
    draw() {
        this.bounceTimer += 0.05;
        const bounceOffsetY = Math.sin(this.bounceTimer) * 3;

        ctx.save();
        ctx.translate(this.x, this.y + bounceOffsetY);
        ctx.fillStyle = "#bdc3c7"; 
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        ctx.fillStyle = "#e74c3c"; 
        ctx.fillRect(-this.width/2, -this.height/6, this.width, this.height/3);
        ctx.restore();
    }
}

class LivingZombie {
    constructor() {
        const borderDist = 30;
        const edgeChoice = Math.floor(Math.random() * 4);
        
        if (edgeChoice === 0) { this.x = Math.random() * canvas.width; this.y = -borderDist; }
        else if (edgeChoice === 1) { this.x = Math.random() * canvas.width; this.y = canvas.height + borderDist; }
        else if (edgeChoice === 2) { this.x = -borderDist; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + borderDist; this.y = Math.random() * canvas.height; }

        this.radius = 11;
        this.health = 25 + (wave * 5);
        this.speed = 1.6 + Math.min(wave * 0.1, 1.4);
        this.markedForDelete = false;
    }
    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist !== 0) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#4a6b52"; 
        ctx.fill();

        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(angle + 0.35) * 5, this.y + Math.sin(angle + 0.35) * 5, 2, 0, Math.PI * 2);
        ctx.arc(this.x + Math.cos(angle - 0.35) * 5, this.y + Math.sin(angle - 0.35) * 5, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

class SimpleBullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.radius = 2.5;
        this.speed = 14;
        this.damage = 25;
        this.markedForDelete = false;
        
        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);
        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }
    update() {
        this.x += this.dx;
        this.y += this.dy;
        
        // Out of bounds cleanup flag
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.markedForDelete = true;
        }
    }
    draw() {
        ctx.fillStyle = "#f1c40f"; 
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Logic Engines
function drawPlayer() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#3498db"; 
    ctx.fill();

    ctx.fillStyle = "#555555";
    ctx.fillRect(4, -2.5, 12, 5);
    ctx.restore();
}

function handleMovement() {
    let dx = 0;
    let dy = 0;

    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * player.speed));
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new SimpleBullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new LivingZombie());
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }
    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 5;
        zombiesSpawned = 0;
        spawnDelay = Math.max(300, spawnDelay - 70);
    }
}

function checkCollisions() {
    // 1. Bullets vs Zombies
    for (let bullet of bullets) {
        if (bullet.markedForDelete) continue;
        for (let zombie of zombies) {
            if (zombie.markedForDelete) continue;
            
            const dist = Math.hypot(bullet.x - zombie.x, bullet.y - zombie.y);
            if (dist < (bullet.radius + zombie.radius)) {
                bullet.markedForDelete = true;
                zombie.health -= bullet.damage;
                
                for (let i = 0; i < 4; i++) {
                    particles.push(new SplatParticle(zombie.x, zombie.y, "#c0392b"));
                }

                if (zombie.health <= 0) {
                    zombie.markedForDelete = true;
                    player.kills++;
                    if (Math.random() < 0.40) {
                        items.push(new FoodCanItem(zombie.x, zombie.y));
                    }
                }
                break; 
            }
        }
    }

    // 2. Player vs Food Cans
    for (let item of items) {
        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < (player.radius + item.width)) {
            item.markedForDelete = true;
            player.foodCans++;
        }
    }

    // 3. Zombies vs Player
    for (let zombie of zombies) {
        if (zombie.markedForDelete) continue;
        const dist = Math.hypot(player.x - zombie.x, player.y - zombie.y);
        if (dist < (player.radius + zombie.radius)) {
            player.health -= 0.5;
            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }

    // Safe memory flush cleanup via filtering out marked instances
    bullets = bullets.filter(b => !b.markedForDelete);
    zombies = zombies.filter(z => !z.markedForDelete);
    items = items.filter(i => !i.markedForDelete);
}

function updateUI() {
    if (waveDisplay) waveDisplay.innerText = `Wave: ${wave}`;
    if (killsDisplay) killsDisplay.innerText = `Kills: ${player.kills}`;
    if (foodDisplay) foodDisplay.innerText = `Food Cans: ${player.foodCans}`;
    
    if (healthBar) {
        healthBar.style.width = `${player.health}%`;
        if (player.health > 50) healthBar.style.backgroundColor = "#2ecc71";
        else if (player.health > 25) healthBar.style.backgroundColor = "#e67e22";
        else healthBar.style.backgroundColor = "#e74c3c";
    }
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.kills = 0;
    player.foodCans = 0;
    wave = 1;
    zombiesToSpawn = 6;
    zombiesSpawned = 0;
    zombies = [];
    bullets = [];
    particles = [];
    items = [];
    gameOver = false;
}

function loop(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handleMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Object pipelines execution tracking
        items.forEach(item => item.draw());
        bullets.forEach(bullet => { bullet.update(); bullet.draw(); });
        zombies.forEach(zombie => { zombie.update(); zombie.draw(); });
        drawPlayer();
    } else {
        ctx.fillStyle = "rgba(20, 20, 20, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "600 36px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 40);
        
        ctx.font = "16px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#aaaaaa";
        ctx.fillText(`Wave Reached: ${wave}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText(`Total Kills: ${player.kills}`, canvas.width / 2, canvas.height / 2 + 35);
        ctx.fillText(`Food Cans Salvaged: ${player.foodCans}`, canvas.width / 2, canvas.height / 2 + 60);
        ctx.fillText("Press 'R' to play again", canvas.width / 2, canvas.height / 2 + 110);
    }

    // Particle FX rendering
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    updateUI();
    requestAnimationFrame(loop);
}

// Fire up core initialization
requestAnimationFrame(loop);
</script>
</body>
</html>
