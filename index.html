<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival - Standard Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #2e3d30; /* Normal dark green grass/ground color */
            border: 4px solid #333333;
            display: block;
            cursor: crosshair;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #health-container {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 200px;
            height: 20px;
            background-color: #333333;
            border: 2px solid #ffffff;
            border-radius: 4px;
            overflow: hidden;
            pointer-events: none;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #27ae60; /* Normal healthy green bar */
            transition: width 0.1s;
        }
        #instructions {
            margin-top: 15px;
            color: #aaaaaa;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud"></div>
        <div id="health-container">
            <div id="health-bar"></div>
        </div>
    </div>
    <div id="instructions">
        [WASD / Arrow Keys] Move | [Left Click] Shoot | [R] Restart Game
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const healthBar = document.getElementById("health-bar");

// Game Variables
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 20,
    speed: 4,
    health: 100,
    kills: 0,
    lastShotTime: 0,
    shootCooldown: 150
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = [];
let wave = 1;
let zombiesToSpawn = 5;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 1000;
let gameOver = false;

// Controls listeners
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') resetGame();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Classes
class SplatParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 2;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class StandardZombie {
    constructor() {
        const edges = ['top', 'bottom', 'left', 'right'];
        const chosenEdge = edges[Math.floor(Math.random() * edges.length)];
        
        if (chosenEdge === 'top') { this.x = Math.random() * canvas.width; this.y = -20; }
        else if (chosenEdge === 'bottom') { this.x = Math.random() * canvas.width; this.y = canvas.height + 20; }
        else if (chosenEdge === 'left') { this.x = -20; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + 20; this.y = Math.random() * canvas.height; }

        this.radius = 12;
        this.health = 30 + (wave * 5);
        this.speed = 1.5 + Math.min(wave * 0.1, 1.5);
    }
    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist !== 0) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
    draw() {
        // Normal circular zombie drawing
        ctx.fillStyle = "#5c8a60"; // Classic zombie rotten green
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#3e5c41";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Simple eyes looking toward target direction
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        ctx.fillStyle = "#ff4d4d"; // Normal dark red eyes
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(angle + 0.4) * 6, this.y + Math.sin(angle + 0.4) * 6, 2, 0, Math.PI * 2);
        ctx.arc(this.x + Math.cos(angle - 0.4) * 6, this.y + Math.sin(angle - 0.4) * 6, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

class StandardBullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.radius = 3;
        this.speed = 12;
        this.damage = 20;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);
        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }
    update() {
        this.x += this.dx;
        this.y += this.dy;
    }
    draw() {
        ctx.fillStyle = "#f39c12"; // Standard bright yellow bullet
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Logic Loops
function drawPlayer() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(angle);

    // Player body circle
    ctx.fillStyle = "#3498db"; // Clean blue hero
    ctx.beginPath();
    ctx.arc(0, 0, player.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#2980b9";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Weapon barrel line pointing toward cursor
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(5, -3, 12, 6);

    ctx.restore();
}

function handleMovement() {
    if (keys['w'] || keys['arrowup']) player.y = Math.max(player.size, player.y - player.speed);
    if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.size, player.y + player.speed);
    if (keys['a'] || keys['arrowleft']) player.x = Math.max(player.size, player.x - player.speed);
    if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.size, player.x + player.speed);
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new StandardBullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new StandardZombie());
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }
    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 5;
        zombiesSpawned = 0;
        spawnDelay = Math.max(400, spawnDelay - 80);
    }
}

function checkCollisions() {
    // Bullet hit tracking
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            const dist = Math.hypot(bullets[b].x - zombies[z].x, bullets[b].y - zombies[z].y);
            if (dist < (bullets[b].radius + zombies[z].radius)) {
                
                // Normal impact hits
                for (let i = 0; i < 4; i++) {
                    particles.push(new SplatParticle(zombies[z].x, zombies[z].y, "#962d22"));
                }
                
                zombies[z].health -= bullets[b].damage;
                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    zombies.splice(z, 1);
                    player.kills++;
                }
                break;
            }
        }
    }

    // Enemy hit player tracking
    for (let z = zombies.length - 1; z >= 0; z--) {
        const dist = Math.hypot(player.x - zombies[z].x, player.y - zombies[z].y);
        if (dist < (player.size / 2 + zombies[z].radius)) {
            player.health -= 0.4;
            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }
}

function updateUI() {
    hud.innerHTML = `Wave: ${wave} | Kills: ${player.kills}`;
    healthBar.style.width = `${player.health}%`;
    
    // Normal color state changes
    if (player.health > 50) healthBar.style.backgroundColor = "#27ae60";
    else if (player.health > 25) healthBar.style.backgroundColor = "#f39c12";
    else healthBar.style.backgroundColor = "#c0392b";
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.kills = 0;
    wave = 1;
    zombiesToSpawn = 5;
    zombiesSpawned = 0;
    zombies = [];
    bullets = [];
    particles = [];
    gameOver = false;
}

function loop(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handleMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Projectiles
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
            }
        }

        // Enemies
        zombies.forEach(zombie => {
            zombie.update();
            zombie.draw();
        });

        drawPlayer();
    } else {
        // Simple gray game over text screen
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = "bold 36px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "18px Arial";
        ctx.fillText(`You reached Wave ${wave} with ${player.kills} kills.`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillText("Press 'R' to play again", canvas.width / 2, canvas.height / 2 + 50);
    }

    // Clear fading hit particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    updateUI();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
