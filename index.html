<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse - Pixel Survival</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #bdc3c7;
            font-family: 'Courier New', Courier, monospace; /* Retro arcade font feel */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 6px solid #2c3e50;
            background-color: #11141a; /* Gritty, dark post-apocalyptic ground color */
            image-rendering: pixelated; /* Forces modern browsers to crisp up rect edges */
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
        }
        #instructions {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="instructions">
        [WASD/Arrows] Move | [Left Click] Fire Pixel Blaster | [R] Retry Apocalypse
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
// Disable smoothing to force crisp pixel edges
ctx.imageSmoothingEnabled = false;

// Game State Variables
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 24, // Box dimensions for pixel style
    speed: 3.5,
    health: 100,
    foodCans: 0,
    lastShotTime: 0,
    shootCooldown: 200
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = []; 
let wave = 1;
let zombiesToSpawn = 5;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 1200;
let gameOver = false;

// Event Listeners
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') {
        resetGame();
    }
});
window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Classes
class PixelParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.floor(Math.random() * 3) + 3; // Blocky fragments
        this.speed = Math.random() * 3 + 1;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        // Snap to grid integer for flawless retro pixels
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

class PixelZombie {
    constructor(waveNumber) {
        const edges = ['top', 'bottom', 'left', 'right'];
        const chosenEdge = edges[Math.floor(Math.random() * edges.length)];
        
        if (chosenEdge === 'top') { this.x = Math.random() * canvas.width; this.y = -30; }
        else if (chosenEdge === 'bottom') { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
        else if (chosenEdge === 'left') { this.x = -30; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }

        this.size = 24; // Multiples of 4 make perfect pixel grids
        this.health = 20 + (waveNumber * 5);
        this.speed = 1.2 + Math.min(waveNumber * 0.15, 2.0);
        this.angle = 0;
        
        // Randomize clothing shades for zombie variation
        this.shirtColor = Math.random() > 0.5 ? "#2e4053" : "#566573";
        this.skinColor = Math.random() > 0.4 ? "#4a7c59" : "#2d5a27"; // Rotting green variants
    }

    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist !== 0) {
            this.angle = Math.atan2(dy, dx);
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        ctx.rotate(this.angle);

        // Pixel Art Grid Layout (-12 to 12 bounds)
        
        // 1. Black Pixel Outline
        ctx.fillStyle = "#000000";
        ctx.fillRect(-14, -14, 28, 28);

        // 2. Main Head & Body base
        ctx.fillStyle = this.skinColor; 
        ctx.fillRect(-12, -12, 24, 24);

        // 3. Tattered Post-Apocalypse Shirt overlay
        ctx.fillStyle = this.shirtColor;
        ctx.fillRect(-12, -12, 8, 24); 

        // 4. Pixelated Outstretched Grabbing Arms
        ctx.fillStyle = this.skinColor;
        ctx.fillRect(8, -10, 8, 4); // Arm 1
        ctx.fillRect(8, 6, 8, 4);  // Arm 2
        // Bloodied hands tip
        ctx.fillStyle = "#922b21";
        ctx.fillRect(14, -10, 4, 4);
        ctx.fillRect(14, 6, 4, 4);

        // 5. Dead Glowing Red Apocalypse Eyes
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(2, -6, 4, 4);
        ctx.fillRect(2, 2, 4, 4);

        ctx.restore();
    }
}

class PixelBullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.size = 6; // Block projectile
        this.speed = 14;
        this.damage = 25;

        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);

        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;
    }

    draw() {
        ctx.save();
        // Yellow core bullet with orange tailing shape
        ctx.fillStyle = "#d35400";
        ctx.fillRect(Math.floor(this.x) - 2, Math.floor(this.y) - 2, this.size + 4, this.size + 4);
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

// Game Mechanics Engine
function handlePlayerMovement() {
    const halfSize = player.size / 2;
    if ((keys['w'] || keys['arrowup']) && player.y > halfSize) player.y -= player.speed;
    if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - halfSize) player.y += player.speed;
    if ((keys['a'] || keys['arrowleft']) && player.x > halfSize) player.x -= player.speed;
    if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - halfSize) player.x += player.speed;
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new PixelBullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new PixelZombie(wave));
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }

    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 6;
        zombiesSpawned = 0;
        spawnDelay = Math.max(400, spawnDelay - 100); // Waves accelerate faster
    }
}

function checkCollisions() {
    // Bullet vs Zombie 
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            if (!bullets[b] || !zombies[z]) continue;
            
            // Box/Distance bounding cross
            const dist = Math.hypot(zombies[z].x - bullets[b].x, zombies[z].y - bullets[b].y);
            
            if (dist < (zombies[z].size / 2) + (bullets[b].size / 2)) {
                zombies[z].health -= bullets[b].damage;
                
                // Dark zombie blood splatter block particles
                for (let i = 0; i < 5; i++) {
                    particles.push(new PixelParticle(bullets[b].x, bullets[b].y, "#196f3d"));
                }

                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    // Massive gore splash explosion on death
                    for (let i = 0; i < 14; i++) {
                        particles.push(new PixelParticle(zombies[z].x, zombies[z].y, Math.random() > 0.4 ? "#922b21" : "#1e8449"));
                    }
                    zombies.splice(z, 1);
                    player.foodCans += 25; // Score point increment
                }
                break; 
            }
        }
    }

    // Zombie vs Player
    for (let z = zombies.length - 1; z >= 0; z--) {
        const dist = Math.hypot(player.x - zombies[z].x, player.y - zombies[z].y);
        if (dist < (player.size / 2) + (zombies[z].size / 2)) {
            player.health -= 0.75; 
            
            // Player damage blood pixels
            if (Math.random() > 0.5) {
                particles.push(new PixelParticle(player.x, player.y, "#ff0000"));
            }
            
            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }
}

function drawPlayer() {
    ctx.save();
    const playerAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.translate(Math.floor(player.x), Math.floor(player.y));
    ctx.rotate(playerAngle);

    // Pixel Survivor Drawing Layout
    // 1. Black border core Outline
    ctx.fillStyle = "#000000";
    ctx.fillRect(-14, -14, 28, 28);

    // 2. Survivor Body Jacket (Apocalyptic Navy Blue)
    ctx.fillStyle = "#2471a3";
    ctx.fillRect(-12, -12, 24, 24);

    // 3. Tactical vest armor panel
    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(-6, -12, 12, 24);

    // 4. Survivor Head/Skin (Pixel square)
    ctx.fillStyle = "#f5cba7";
    ctx.fillRect(-8, -8, 14, 16);

    // 5. Weapon sprite block (Dual shotgun barrels)
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(10, -5, 12, 4);
    ctx.fillRect(10, 1, 12, 4);
    ctx.fillStyle = "#111111"; // Gun trim muzzle tip
    ctx.fillRect(20, -5, 2, 10);

    ctx.restore();
}

function drawUI() {
    // Retro UI Styling
    // Health HUD
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(20, 20, 200, 20);
    ctx.fillStyle = player.health > 30 ? "#c0392b" : "#7b241c"; // Apocalypse red health
    ctx.fillRect(20, 20, player.health * 2, 20);
    
    // Grid overlay for health bar to look like segments
    ctx.strokeStyle = "#11141a";
    ctx.lineWidth = 2;
    for(let i = 1; i < 10; i++) {
        ctx.beginPath();
        ctx.moveTo(20 + (i * 20), 20);
        ctx.lineTo(20 + (i * 20), 40);
        ctx.stroke();
    }

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px 'Courier New'";
    ctx.fillText(`SURVIVOR HP: ${Math.ceil(player.health)}%`, 30, 34);

    // Day/Wave Counter
    ctx.font = "bold 22px 'Courier New'";
    ctx.fillStyle = "#e67e22";
    ctx.fillText(`SURVIVAL: DAY ${wave}`, canvas.width / 2 - 95, 38);

    // Supplies/Score Collected 
    ctx.font = "bold 14px 'Courier New'";
    ctx.fillStyle = "#f1c40f";
    ctx.fillText(`SUPPLIES: ${player.foodCans} PTS`, canvas.width - 190, 34);

    if (gameOver) {
        ctx.fillStyle = "rgba(16, 16, 20, 0.95)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "bold 44px 'Courier New'";
        ctx.fillStyle = "#922b21";
        ctx.fillText("YOU WERE OVERRUN", canvas.width / 2 - 200, canvas.height / 2 - 30);

        ctx.font = "20px 'Courier New'";
        ctx.fillStyle = "#bdc3c7";
        ctx.fillText(`Survived Until Day ${wave}`, canvas.width / 2 - 120, canvas.height / 2 + 15);
        
        ctx.fillStyle = "#7f8c8d";
        ctx.fillText("Press [R] to Respawn Alternative Timeline", canvas.width / 2 - 230, canvas.height / 2 + 60);
    }
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.foodCans = 0;
    zombies = [];
    bullets = [];
    particles = [];
    wave = 1;
    zombiesToSpawn = 5;
    zombiesSpawned = 0;
    spawnDelay = 1200;
    gameOver = false;
}

// Global Animation Engine Loop
function gameLoop(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handlePlayerMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Update arrays
        zombies.forEach(z => z.update());
        bullets.forEach(b => b.update());
        particles.forEach(p => p.update());

        // Housekeeping arrays
        bullets = bullets.filter(b => b.x >= 0 && b.x <= canvas.width && b.y >= 0 && b.y <= canvas.height);
        particles = particles.filter(p => p.alpha > 0);
    }

    // Render Pipeline (Pixel order stacking)
    particles.forEach(p => p.draw());
    bullets.forEach(b => b.draw());
    zombies.forEach(z => z.draw());
    drawPlayer();
    drawUI();

    requestAnimationFrame(gameLoop);
}

// Start Game Entrypoint
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
