<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse - Pixel Survival</title>
    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #c0392b;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui-wrapper {
            position: relative;
        }
        canvas {
            border: 6px solid #1a1a1a;
            background-color: #0d0f12; 
            image-rendering: pixelated;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.3);
            cursor: crosshair;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e74c3c;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            line-height: 1.5;
        }
        #instructions {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
            font-weight: bold;
        }
        .danger-text {
            color: #e74c3c;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud"></div>
    </div>
    <div id="instructions">
        [WASD/Arrows] Move | [Left Click] Fire Weapon | <span class="danger-text">[R] Restart Apocalypse</span>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
ctx.imageSmoothingEnabled = false;

// Game State Variables
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 24,
    speed: 3.5,
    health: 100,
    maxHealth: 100,
    kills: 0,
    lastShotTime: 0,
    shootCooldown: 180
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = []; 
let wave = 1;
let zombiesToSpawn = 5;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 1200;
let gameOver = false;

// Event Listeners
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') {
        resetGame();
    }
});
window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Classes
class PixelParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.floor(Math.random() * 3) + 3;
        this.speed = Math.random() * 4 + 1;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.04 + 0.02;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

class PixelZombie {
    constructor(waveNumber) {
        const edges = ['top', 'bottom', 'left', 'right'];
        const chosenEdge = edges[Math.floor(Math.random() * edges.length)];
        
        if (chosenEdge === 'top') { this.x = Math.random() * canvas.width; this.y = -30; }
        else if (chosenEdge === 'bottom') { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
        else if (chosenEdge === 'left') { this.x = -30; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }

        this.size = 24;
        this.health = 20 + (waveNumber * 8);
        this.speed = 1.0 + Math.min(waveNumber * 0.12, 2.2);
        this.angle = 0;
        
        // Post-apocalyptic variants (decayed shirts and rotten skin colors)
        this.shirtColor = Math.random() > 0.5 ? "#2c3e50" : "#7f8c8d";
        this.skinColor = Math.random() > 0.5 ? "#27ae60" : "#1e824c";
    }

    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist !== 0) {
            this.angle = Math.atan2(dy, dx);
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        ctx.rotate(this.angle);

        // Outer Silhouette Outline
        ctx.fillStyle = "#000000";
        ctx.fillRect(-14, -14, 28, 28);

        // Flesh/Body Core
        ctx.fillStyle = this.skinColor; 
        ctx.fillRect(-12, -12, 24, 24);

        // Torn Clothing Layers
        ctx.fillStyle = this.shirtColor;
        ctx.fillRect(-12, -12, 10, 24); 

        // Grabbing Undead Limbs
        ctx.fillStyle = this.skinColor;
        ctx.fillRect(8, -10, 8, 4);
        ctx.fillRect(8, 6, 8, 4);
        
        // Exposed Wounds & Bloodied Fingers
        ctx.fillStyle = "#962d22";
        ctx.fillRect(14, -10, 4, 4);
        ctx.fillRect(14, 6, 4, 4);
        ctx.fillRect(-4, -6, 4, 4);

        // Crimson Piercing Eyes
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(2, -6, 4, 4);
        ctx.fillRect(2, 2, 4, 4);

        ctx.restore();
    }
}

class PixelBullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.size = 6;
        this.speed = 14;
        this.damage = 25;

        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);

        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;
    }

    draw() {
        ctx.save();
        ctx.fillStyle = "#e67e22";
        ctx.fillRect(Math.floor(this.x) - 2, Math.floor(this.y) - 2, this.size + 4, this.size + 4);
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

// Engine Functions
function drawPlayer() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.save();
    ctx.translate(Math.floor(player.x), Math.floor(player.y));
    ctx.rotate(angle);

    // Player Structural Border
    ctx.fillStyle = "#000000";
    ctx.fillRect(-14, -14, 28, 28);

    // Hazard Armor Vest
    ctx.fillStyle = "#d35400"; 
    ctx.fillRect(-12, -12, 24, 24);

    // Survival Tactical Gear Details
    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(-6, -12, 12, 24);

    // Extended Weapon Platform
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(4, 4, 14, 6);
    ctx.fillStyle = "#111111";
    ctx.fillRect(14, 5, 6, 4);

    ctx.restore();
}

function handlePlayerMovement() {
    const halfSize = player.size / 2;
    if ((keys['w'] || keys['arrowup']) && player.y > halfSize) player.y -= player.speed;
    if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - halfSize) player.y += player.speed;
    if ((keys['a'] || keys['arrowleft']) && player.x > halfSize) player.x -= player.speed;
    if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - halfSize) player.x += player.speed;
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new PixelBullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new PixelZombie(wave));
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }

    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 6;
        zombiesSpawned = 0;
        spawnDelay = Math.max(350, spawnDelay - 120);
    }
}

function checkCollisions() {
    // Bullet to Zombie Impacts
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            const dist = Math.hypot(bullets[b].x - zombies[z].x, bullets[b].y - zombies[z].y);
            if (dist < (bullets[b].size / 2 + zombies[z].size / 2)) {
                
                // Blood Spatter Generation
                for (let i = 0; i < 6; i++) {
                    particles.push(new PixelParticle(zombies[z].x, zombies[z].y, "#c0392b"));
                }
                
                zombies[z].health -= bullets[b].damage;
                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    // Massive explosion of particles on fatality
                    for (let i = 0; i < 12; i++) {
                        particles.push(new PixelParticle(zombies[z].x, zombies[z].y, "#7b241c"));
                    }
                    zombies.splice(z, 1);
                    player.kills++;
                }
                break;
            }
        }
    }

    // Zombie to Player Harmful Ingress
    for (let z = zombies.length - 1; z >= 0; z--) {
        const dist = Math.hypot(player.x - zombies[z].x, player.y - zombies[z].y);
        if (dist < (player.size / 2 + zombies[z].size / 2)) {
            player.health -= 0.5; // Progressive damage scaling
            
            // Damage particle emission
            if (Math.random() > 0.85) {
                particles.push(new PixelParticle(player.x, player.y, "#ff3333"));
            }

            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }
}

function updateUI() {
    hud.innerHTML = `
        WAVE: ${wave}<br>
        SURVIVORS ELIMINATED: ${player.kills}<br>
        VITALITY: ${Math.ceil(player.health)}%
    `;
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.kills = 0;
    wave = 1;
    zombiesToSpawn = 5;
    zombiesSpawned = 0;
    spawnDelay = 1200;
    zombies = [];
    bullets = [];
    particles = [];
    gameOver = false;
}

// Global Game Loop Execution
function loop(timestamp) {
    // Semi-transparent clearing layer provides trailing ghost motion artifacts
    ctx.fillStyle = "rgba(13, 15, 18, 0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handlePlayerMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Projectile Updates
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
            }
        }

        // Hostile Unit Updates
        zombies.forEach(zombie => {
            zombie.update();
            zombie.draw();
        });

        drawPlayer();
    } else {
        // Apocalyptic Game Over Display Screen
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "bold 44px 'Courier New'";
        ctx.fillStyle = "#c0392b";
        ctx.textAlign = "center";
        ctx.fillText("YOU WERE CONSUMED", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = "20px 'Courier New'";
        ctx.fillStyle = "#bdc3c7";
        ctx.fillText(`YOU SURVIVED ${wave} WAVES AND KILLED ${player.kills} UNDEAD`, canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText("PRESS 'R' TO RESURRECT", canvas.width / 2, canvas.height / 2 + 70);
    }

    // Dynamic Visual FX Update Engine
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
        }
    }

    updateUI();
    requestAnimationFrame(loop);
}

// Initialize Loop
requestAnimationFrame(loop);
</script>
</body>
</html>
