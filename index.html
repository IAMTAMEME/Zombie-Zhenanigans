<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse - Pixel Survival</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #bdc3c7;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui-wrapper {
            position: relative;
        }
        canvas {
            border: 6px solid #2c3e50;
            background-color: #11141a; 
            image-rendering: pixelated;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e74c3c;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            line-height: 1.5;
        }
        /* Health Bar UI Container */
        #health-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 20px;
            background-color: #555;
            border: 3px solid #000;
            pointer-events: none;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #c0392b;
            transition: width 0.1s ease;
        }
        #instructions {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud"></div>
        <div id="health-container">
            <div id="health-bar"></div>
        </div>
    </div>
    <div id="instructions">
        [WASD/Arrows] Move | [Left Click] Fire Pixel Blaster | [R] Retry Apocalypse
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const healthBar = document.getElementById("health-bar");
ctx.imageSmoothingEnabled = false;

// Game State Variables
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 24,
    speed: 3.5,
    health: 100,
    maxHealth: 100,
    kills: 0,
    lastShotTime: 0,
    shootCooldown: 200
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = []; 
let wave = 1;
let zombiesToSpawn = 5;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 1200;
let gameOver = false;

// Event Listeners
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') {
        resetGame();
    }
});
window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Classes
class PixelParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.floor(Math.random() * 3) + 3;
        this.speed = Math.random() * 3 + 1;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

class PixelZombie {
    constructor(waveNumber) {
        const edges = ['top', 'bottom', 'left', 'right'];
        const chosenEdge = edges[Math.floor(Math.random() * edges.length)];
        
        if (chosenEdge === 'top') { this.x = Math.random() * canvas.width; this.y = -30; }
        else if (chosenEdge === 'bottom') { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
        else if (chosenEdge === 'left') { this.x = -30; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }

        this.size = 24;
        this.health = 20 + (waveNumber * 5);
        this.speed = 1.2 + Math.min(waveNumber * 0.15, 2.0);
        this.angle = 0;
    }

    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist !== 0) {
            this.angle = Math.atan2(dy, dx);
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        ctx.rotate(this.angle);

        // 1. Black outer shadow line
        ctx.fillStyle = "#000000";
        ctx.fillRect(-14, -14, 28, 28);

        // 2. Thick Green Outline
        ctx.fillStyle = "#27ae60"; 
        ctx.fillRect(-12, -12, 24, 24);

        // 3. Dark interior fill to leave the green border visible (Cube Style)
        ctx.fillStyle = "#1c2833";
        ctx.fillRect(-9, -9, 18, 18); 

        // 4. Black Scars running through the cube
        ctx.fillStyle = "#000000";
        ctx.fillRect(-5, -5, 10, 2);  // Scar 1
        ctx.fillRect(2, -2, 2, 8);    // Scar 2
        ctx.fillRect(-7, 3, 6, 2);    // Scar 3

        // 5. Glowing Red Eyes
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(2, -6, 4, 4);
        ctx.fillRect(2, 2, 4, 4);

        ctx.restore();
    }
}

class PixelBullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.size = 6;
        this.speed = 14;
        this.damage = 25;

        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);

        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;
    }

    draw() {
        ctx.save();
        ctx.fillStyle = "#d35400";
        ctx.fillRect(Math.floor(this.x) - 2, Math.floor(this.y) - 2, this.size + 4, this.size + 4);
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

// Engine Functions
function drawPlayer() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.save();
    ctx.translate(Math.floor(player.x), Math.floor(player.y));
    ctx.rotate(angle);

    // Player Outer Frame
    ctx.fillStyle = "#000000";
    ctx.fillRect(-14, -14, 28, 28);

    // Player Base Skin
    ctx.fillStyle = "#3498db"; 
    ctx.fillRect(-12, -12, 24, 24);

    // Blaster Barrel
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(8, -4, 12, 8);

    ctx.restore();
}

function handlePlayerMovement() {
    const halfSize = player.size / 2;
    if ((keys['w'] || keys['arrowup']) && player.y > halfSize) player.y -= player.speed;
    if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - halfSize) player.y += player.speed;
    if ((keys['a'] || keys['arrowleft']) && player.x > halfSize) player.x -= player.speed;
    if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - halfSize) player.x += player.speed;
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new PixelBullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new PixelZombie(wave));
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }

    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 6;
        zombiesSpawned = 0;
        spawnDelay = Math.max(400, spawnDelay - 100);
    }
}

function checkCollisions() {
    // Bullets vs Zombies
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            const dist = Math.hypot(bullets[b].x - zombies[z].x, bullets[b].y - zombies[z].y);
            if (dist < (bullets[b].size / 2 + zombies[z].size / 2)) {
                
                for (let i = 0; i < 6; i++) {
                    particles.push(new PixelParticle(zombies[z].x, zombies[z].y, "#c0392b"));
                }
                
                zombies[z].health -= bullets[b].damage;
                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    for (let i = 0; i < 12; i++) {
                        particles.push(new PixelParticle(zombies[z].x, zombies[z].y, "#7b241c"));
                    }
                    zombies.splice(z, 1);
                    player.kills++;
                }
                break;
            }
        }
    }

    // Zombies vs Player
    for (let z = zombies.length - 1; z >= 0; z--) {
        const dist = Math.hypot(player.x - zombies[z].x, player.y - zombies[z].y);
        if (dist < (player.size / 2 + zombies[z].size / 2)) {
            player.health -= 0.5;
            
            if (Math.random() > 0.85) {
                particles.push(new PixelParticle(player.x, player.y, "#ff3333"));
            }

            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }
}

function updateUI() {
    hud.innerHTML = `
        WAVE: ${wave}<br>
        KILLS: ${player.kills}
    `;
    // Update the visual health bar width dynamically
    healthBar.style.width = `${Math.max(0, player.health)}%`;
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.kills = 0;
    wave = 1;
    zombiesToSpawn = 5;
    zombiesSpawned = 0;
    spawnDelay = 1200;
    zombies = [];
    bullets = [];
    particles = [];
    gameOver = false;
}

function loop(timestamp) {
    ctx.fillStyle = "rgba(17, 20, 26, 0.3)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handlePlayerMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Projectiles
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
            }
        }

        // Hostile Cube Units
        zombies.forEach(zombie => {
            zombie.update();
            zombie.draw();
        });

        drawPlayer();
    } else {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "bold 44px 'Courier New'";
        ctx.fillStyle = "#c0392b";
        ctx.textAlign = "center";
        ctx.fillText("YOU WERE CONSUMED", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = "20px 'Courier New'";
        ctx.fillStyle = "#bdc3c7";
        ctx.fillText(`YOU SURVIVED ${wave} WAVES AND KILLED ${player.kills} CUBES`, canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText("PRESS 'R' TO RESURRECT", canvas.width / 2, canvas.height / 2 + 70);
    }

    // VFX Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
        }
    }

    updateUI();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
