<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Zhenanigans</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #ui { margin-bottom: 20px; font-size: 22px; font-weight: bold; letter-spacing: 2px; text-align: center; width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .hp-label { margin-right: 12px; letter-spacing: 1px; }
        #health-container { width: 200px; height: 20px; background-color: #444; border: 2px solid #555; border-radius: 3px; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background-color: #00ff66; transition: width 0.1s ease; }
        #weapon-display { font-size: 16px; color: #ffcc00; }
        #game-container { position: relative; width: 800px; height: 600px; }
        canvas { background-color: #1a1a1a; border: 4px solid #333; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); cursor: crosshair; position: absolute; top: 0; left: 0; }
        #gameover { display: none; position: absolute; width: 100%; top: 40%; font-size: 48px; color: #ff3333; font-weight: bold; text-shadow: 2px 2px #000; text-align: center; line-height: 1.6; z-index: 10; }
        #restart { margin-top: 25px; padding: 12px 24px; font-size: 18px; background: #ff3333; color: white; border: none; cursor: pointer; border-radius: 5px; letter-spacing: 1px; }
        #wave-banner { position: absolute; width: 100%; top: 45%; font-size: 64px; color: #ffcc00; font-weight: bold; text-shadow: 3px 3px #000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; letter-spacing: 4px; text-align: center; z-index: 5; }
        #shop-ui { display: none; position: absolute; top: -500px; left: 100px; width: 600px; background: rgba(20, 20, 20, 0.95); border: 4px solid #ffcc00; border-radius: 10px; box-shadow: 0 0 30px rgba(255, 204, 0, 0.4); padding: 25px; box-sizing: border-box; text-align: center; z-index: 20; transition: top 0.4s ease-out; }
        #shop-ui.active { display: block; top: 60px; }
        #shop-title { font-size: 28px; color: #ffcc00; margin-bottom: 25px; letter-spacing: 2px; font-weight: bold; }
        .shop-btn { width: 100%; margin: 12px 0; padding: 15px; background: #00ff66; color: #111; border: none; border-radius: 6px; cursor: pointer; font-family: Arial, sans-serif; transition: background 0.2s, transform 0.1s; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .shop-btn:hover { background: #00cc52; transform: translateY(-1px); }
        .shop-btn:active { transform: translateY(1px); }
        .shop-btn:disabled { background: #444; color: #777; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-title { font-size: 18px; font-weight: bold; display: block; margin-bottom: 4px; }
        .btn-desc { font-size: 13px; opacity: 0.85; display: block; }
        #skip-shop-btn { width: 100%; margin-top: 20px; padding: 15px; background: #ff3333; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; letter-spacing: 1px; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #skip-shop-btn:hover { background: #cc2424; }
        #hack-trigger-btn { position: absolute; bottom: 15px; left: 15px; background: rgba(30, 30, 30, 0.7); color: #555; border: 1px solid #333; padding: 4px 8px; font-weight: bold; cursor: pointer; border-radius: 3px; font-size: 12px; z-index: 25; transition: all 0.2s; }
        #hack-trigger-btn:hover { background: #ff0055; color: #fff; border-color: #fff; box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        #cheat-menu { display: none; position: absolute; top: 50px; left: 250px; width: 300px; background: rgba(35, 15, 15, 0.95); border: 3px dashed #ff0055; border-radius: 8px; padding: 15px; box-sizing: border-box; z-index: 30; box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); }
        .cheat-title { font-size: 20px; color: #ff0055; margin-bottom: 15px; text-align: center; font-weight: bold; letter-spacing: 1px; }
        .cheat-item { margin: 12px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .cheat-input { width: 60px; background: #222; border: 1px solid #ff0055; color: #fff; padding: 4px; text-align: center; border-radius: 3px; }
        .cheat-btn { background: #ff0055; color: #fff; border: none; padding: 4px 10px; cursor: pointer; font-weight: bold; border-radius: 3px; }
        .cheat-btn:hover { background: #cc0044; }
        .cheat-close-btn { width: 100%; margin-top: 10px; background: #444; color: #fff; border: none; padding: 6px; cursor: pointer; border-radius: 3px; }
        .cheat-slider-item { margin: 12px 0; font-size: 14px; }
        .cheat-slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .cheat-slider-val { color: #ff0055; font-weight: bold; }
        .cheat-slider { width: 100%; accent-color: #ff0055; }
    </style>
</head>
<body>
    <div id="ui">
        <div>ZOMBIE ZHENGANINZANS</div>
        <div style="display: flex; align-items: center;">
            <span class="hp-label">HP:</span>
            <div id="health-container"><div id="health-bar"></div></div>
        </div>
        <div>Wave: <span id="wave">0</span></div>
        <div>🥫 <span id="foodCans">0</span></div>
        <div id="weapon-display">Gun: Pistol [1]</div>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <button id="hack-trigger-btn" onclick="tryOpenHacks()">????</button>
        <div id="wave-banner">WAVE 1</div>
        <div id="gameover">
            GAME OVER <br>
            <button id="restart" onclick="resetGame()">Try Again</button>
        </div>
        <div id="shop-ui">
            <div id="shop-title">🛒 GUN SHOP</div>
            <button class="shop-btn" id="btn-loader" onclick="buyItem('shotgun', 30)">
                <span class="btn-title">Shotgun (🥫 30 Cans)</span>
                <span class="btn-desc">3-bullet spread. MASSIVE damage up close, weak far away.</span>
            </button>
            <button class="shop-btn" id="btn-caliber" onclick="buyItem('glizzy', 50)">
                <span class="btn-title">Glizzy Launcher (🥫 50 Cans)</span>
                <span class="btn-desc">Shoots hot dogs that slow (fatten) zombies on hit.</span>
            </button>
            <button class="shop-btn" id="btn-boots" onclick="buyItem('water', 69)">
                <span class="btn-title">Water Gun (🥫 69 Cans)</span>
                <span class="btn-desc">Phews blue water bullets. Same damage, wetter.</span>
            </button>
            <button id="skip-shop-btn" onclick="closeShop()">SKIP SHOP & START NEXT WAVE</button>
        </div>
        <div id="cheat-menu">
            <div class="cheat-title">💀 DEV TOOLS</div>
            <div class="cheat-item">
                <label>Set Target Wave:</label>
                <div>
                    <input type="number" id="cheat-wave-num" class="cheat-input" value="1">
                    <button class="cheat-btn" onclick="cheatSetWave()">Set</button>
                </div>
            </div>
            <div class="cheat-item">
                <label>Trigger Bot Auto-Fire:</label>
                <input type="checkbox" id="cheat-triggerbot" onchange="toggleTriggerbot(this.checked)">
            </div>
            <div class="cheat-item">
                <label>Invisibility / Godmode:</label>
                <input type="checkbox" id="cheat-invisible" onchange="toggleInvisibility(this.checked)">
            </div>
            <div class="cheat-slider-item">
                <div class="cheat-slider-row"><label>Speed:</label><span class="cheat-slider-val" id="cheat-speed-val">4</span></div>
                <input type="range" min="1" max="20" step="0.5" value="4" class="cheat-slider" id="cheat-speed" oninput="cheatSetSpeed(this.value)">
            </div>
            <div class="cheat-slider-item">
                <div class="cheat-slider-row"><label>Damage (bullet size):</label><span class="cheat-slider-val" id="cheat-damage-val">4</span></div>
                <input type="range" min="2" max="40" step="1" value="4" class="cheat-slider" id="cheat-damage" oninput="cheatSetDamage(this.value)">
            </div>
            <div class="cheat-slider-item">
                <div class="cheat-slider-row"><label>Health:</label><span class="cheat-slider-val" id="cheat-health-val">100</span></div>
                <input type="range" min="10" max="1000" step="10" value="100" class="cheat-slider" id="cheat-health" oninput="cheatSetHealth(this.value)">
            </div>
            <div class="cheat-item">
                <label>Add 100 Cans Cash:</label>
                <button class="cheat-btn" onclick="cheatGiveCans()">+100</button>
            </div>
            <button class="cheat-close-btn" onclick="closeCheatMenu()">Close Matrix</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const foodCansEl = document.getElementById("foodCans");
        const waveEl = document.getElementById("wave");
        const healthBarEl = document.getElementById("health-bar");
        const gameoverEl = document.getElementById("gameover");
        const waveBanner = document.getElementById("wave-banner");
        const shopUiEl = document.getElementById("shop-ui");
        const cheatMenuEl = document.getElementById("cheat-menu");
        const weaponDisplayEl = document.getElementById("weapon-display");

        let player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 };
        let bullets = [];
        let zombies = [];
        let keys = {};
        let mouse = { x: 0, y: 0 };
        let foodCans = 0;
        let gameOver = false;
        let bulletSize = 4;
        let lastShootTime = 0;
        let currentWave = 0;
        let waveState = "READY_TO_START";
        let lastHitTime = 0;
        const hitCooldown = 400;
        let isShopOpen = false;
        let hackTriggerbotActive = false;
        let hackInvisibilityActive = false;

        const WEAPONS = {
            pistol:  { name: "Pistol",          cooldown: 500, color: "#ffcc00" },
            shotgun: { name: "Shotgun",         cooldown: 700, color: "#ff8800" },
            glizzy:  { name: "Glizzy Launcher", cooldown: 550, color: "#d83030" },
            water:   { name: "Water Gun",       cooldown: 450, color: "#33aaff" },
        };
        let ownedWeapons = { pistol: true, shotgun: false, glizzy: false, water: false };
        let currentWeapon = "pistol";
        let shootCooldown = WEAPONS.pistol.cooldown;

        function updateWeaponDisplay() {
            const slots = ["pistol","shotgun","glizzy","water"];
            const parts = slots.map((w,i) => {
                if (!ownedWeapons[w]) return null;
                const tag = `${WEAPONS[w].name} [${i+1}]`;
                return w === currentWeapon ? `▶ ${tag}` : tag;
            }).filter(Boolean);
            weaponDisplayEl.innerText = "Gun: " + parts.join("  |  ");
        }

        function switchWeapon(w) {
            if (!ownedWeapons[w]) return;
            currentWeapon = w;
            shootCooldown = WEAPONS[w].cooldown;
            updateWeaponDisplay();
        }

        window.addEventListener("keydown", (e) => {
            if (isShopOpen) return;
            keys[e.key.toLowerCase()] = true;
            if (e.key === "1") switchWeapon("pistol");
            if (e.key === "2") switchWeapon("shotgun");
            if (e.key === "3") switchWeapon("glizzy");
            if (e.key === "4") switchWeapon("water");
        });
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener("mousedown", () => { if (!gameOver && !isShopOpen) shoot(); });

        function makeBullet(angle, opts) {
            const speed = opts.speed || 8;
            return {
                x: player.x, y: player.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: opts.size || bulletSize,
                damage: opts.damage || 1,
                type: opts.type || "normal",
                color: opts.color || "#ffcc00",
                startX: player.x, startY: player.y,
                maxRange: opts.maxRange || 9999,
                falloff: opts.falloff || false,
                slow: opts.slow || 0,
                length: opts.length || 0,
                angle: angle,
            };
        }

        function shoot() {
            const now = performance.now();
            if (now - lastShootTime < shootCooldown) return;
            lastShootTime = now;
            const baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            if (currentWeapon === "pistol") {
                bullets.push(makeBullet(baseAngle, { damage: 1, size: bulletSize, color: "#ffcc00" }));
            } else if (currentWeapon === "shotgun") {
                const spread = 0.22;
                for (let i = -1; i <= 1; i++) {
                    bullets.push(makeBullet(baseAngle + spread * i, {
                        damage: 5, size: bulletSize + 1, color: "#ff8800",
                        speed: 9, falloff: true, maxRange: 280,
                    }));
                }
            } else if (currentWeapon === "glizzy") {
                bullets.push(makeBullet(baseAngle, {
                    damage: 2, size: bulletSize + 1, color: "#d83030",
                    type: "glizzy", length: 18, slow: 0.5, speed: 7,
                }));
            } else if (currentWeapon === "water") {
                bullets.push(makeBullet(baseAngle, {
                    damage: 1, size: bulletSize, color: "#33aaff", type: "water", speed: 9,
                }));
            }
        }

        function updateHealthBar() {
            let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            healthBarEl.style.width = hpPercent + "%";
            if (hpPercent < 30) healthBarEl.style.backgroundColor = "#ff3333";
            else if (hpPercent < 60) healthBarEl.style.backgroundColor = "#ff9900";
            else healthBarEl.style.backgroundColor = "#00ff66";
        }

        function startNextWave() {
            waveState = "SPAWNING";
            currentWave++;
            waveEl.innerText = currentWave;
            waveBanner.innerText = `WAVE ${currentWave}`;
            waveBanner.style.opacity = "1";
            setTimeout(() => {
                if (gameOver) return;
                waveBanner.style.opacity = "0";
                let zombieCount = currentWave + 2;
                for (let i = 0; i < zombieCount; i++) spawnZombie();
                waveState = "FIGHTING";
            }, 2000);
        }

        function spawnZombie() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : canvas.width + 30;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -30 : canvas.height + 30;
            }
            const baseHp = 3 + Math.floor(currentWave / 3);
            zombies.push({ x, y, size: 16, baseSpeed: 1.5, speed: 1.5, angle: 0, hp: baseHp, maxHp: baseHp, slowUntil: 0, fatness: 1 });
        }

        function openShop() {
            isShopOpen = true;
            keys = {};
            document.getElementById("btn-loader").disabled = foodCans < 15 || ownedWeapons.shotgun;
            document.getElementById("btn-caliber").disabled = foodCans < 20 || ownedWeapons.glizzy;
            document.getElementById("btn-boots").disabled = foodCans < 25 || ownedWeapons.water;
            shopUiEl.classList.add("active");
        }

        function buyItem(item, cost) {
            if (foodCans < cost) return;
            if (ownedWeapons[item]) return;
            foodCans -= cost;
            foodCansEl.innerText = foodCans;
            ownedWeapons[item] = true;
            switchWeapon(item);
            closeShop();
        }

        function closeShop() {
            shopUiEl.classList.remove("active");
            isShopOpen = false;
            startNextWave();
        }

        function tryOpenHacks() {
            let pass = prompt("Enter Secret Code:");
            if (pass === "0000") cheatMenuEl.style.display = "block";
            else alert("ACCESS DENIED");
        }
        function closeCheatMenu() { cheatMenuEl.style.display = "none"; }
        function cheatSetWave() {
            let val = parseInt(document.getElementById("cheat-wave-num").value);
            if (!isNaN(val) && val >= 0) {
                currentWave = val - 1;
                zombies = []; bullets = []; isShopOpen = false;
                shopUiEl.classList.remove("active");
                waveState = "READY_TO_START";
            }
        }
        function toggleTriggerbot(checked) { hackTriggerbotActive = checked; }
        function toggleInvisibility(checked) { hackInvisibilityActive = checked; }
        function cheatGiveCans() {
            foodCans += 100;
            foodCansEl.innerText = foodCans;
            if (isShopOpen) openShop();
        }
        function cheatSetSpeed(v) { player.speed = parseFloat(v); document.getElementById("cheat-speed-val").innerText = v; }
        function cheatSetDamage(v) { bulletSize = parseInt(v); document.getElementById("cheat-damage-val").innerText = v; }
        function cheatSetHealth(v) {
            const nv = parseInt(v);
            player.maxHp = nv; player.hp = nv;
            document.getElementById("cheat-health-val").innerText = v;
            updateHealthBar();
        }

        function update(time) {
            if (gameOver) return;
            if (!isShopOpen) {
                if (keys['w'] || keys['arrowup']) player.y -= player.speed;
                if (keys['s'] || keys['arrowdown']) player.y += player.speed;
                if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
                if (keys['d'] || keys['arrowright']) player.x += player.speed;
                player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
                player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
            }
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            if (isShopOpen) return;

            if (zombies.length === 0 && waveState === "READY_TO_START") {
                if (currentWave > 0 && currentWave % 10 === 0) {
                    waveState = "SHOPPING"; openShop(); return;
                }
                startNextWave();
            }

            if (hackTriggerbotActive && zombies.length > 0) {
                let cz = zombies[0];
                let md = Math.hypot(cz.x - player.x, cz.y - player.y);
                for (let i = 1; i < zombies.length; i++) {
                    let d = Math.hypot(zombies[i].x - player.x, zombies[i].y - player.y);
                    if (d < md) { md = d; cz = zombies[i]; }
                }
                mouse.x = cz.x; mouse.y = cz.y;
                shoot();
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy;
                const traveled = Math.hypot(b.x - b.startX, b.y - b.startY);
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || traveled > b.maxRange) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                if (time < z.slowUntil) { z.speed = z.baseSpeed * 0.4; z.fatness = 1.5; }
                else { z.speed = z.baseSpeed; z.fatness = 1; }

                let dx = player.x - z.x;
                let dy = player.y - z.y;
                let dist = Math.hypot(dx, dy);
                z.x += (dx / dist) * z.speed;
                z.y += (dy / dist) * z.speed;
                z.angle = Math.atan2(dy, dx);
                const hitRadius = z.size * z.fatness;

                if (dist < player.size + hitRadius) {
                    if (!hackInvisibilityActive && (time - lastHitTime > hitCooldown)) {
                        player.hp -= 20;
                        lastHitTime = time;
                        updateHealthBar();
                        if (player.hp <= 0) { gameOver = true; gameoverEl.style.display = "block"; }
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let bDist = Math.hypot(b.x - z.x, b.y - z.y);
                    if (bDist < hitRadius + b.size) {
                        let dmg = b.damage;
                        if (b.falloff) {
                            const traveled = Math.hypot(b.x - b.startX, b.y - b.startY);
                            const f = Math.max(0.15, 1 - (traveled / b.maxRange));
                            dmg = Math.max(1, Math.round(dmg * f));
                        }
                        z.hp -= dmg;
                        if (b.slow > 0) z.slowUntil = time + b.slow * 1000 + 1500;
                        bullets.splice(j, 1);
                        if (z.hp <= 0) {
                            zombies.splice(i, 1);
                            foodCans += 1;
                            foodCansEl.innerText = foodCans;
                            break;
                        }
                    }
                }
            }
            if (zombies.length === 0 && waveState === "FIGHTING") waveState = "READY_TO_START";
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = hackInvisibilityActive ? "rgba(51, 136, 255, 0.4)" : "#3388ff";
            ctx.beginPath();
            ctx.arc(0, 0, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = WEAPONS[currentWeapon].color;
            ctx.fillRect(0, -4, 25, 8);
            ctx.restore();

            if (isShopOpen) return;

            bullets.forEach(b => {
                if (b.type === "glizzy") {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.angle);
                    ctx.fillStyle = "#d83030";
                    ctx.beginPath();
                    ctx.ellipse(0, 0, b.length, b.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#f0d090";
                    ctx.fillRect(-b.length, -b.size * 0.4, b.length * 2, b.size * 0.3);
                    ctx.restore();
                } else if (b.type === "water") {
                    ctx.fillStyle = "#33aaff";
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "rgba(180,220,255,0.7)";
                    ctx.beginPath();
                    ctx.arc(b.x - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            zombies.forEach(z => {
                ctx.save();
                ctx.translate(z.x, z.y);
                ctx.rotate(z.angle);
                ctx.imageSmoothingEnabled = false;
                const s = z.size * z.fatness;
                const p = (s * 2) / 8;
                ctx.fillStyle = z.fatness > 1 ? "#4a8a44" : "#356e31";
                ctx.fillRect(-s, -s, s * 2, s * 2);
                ctx.fillStyle = "#1e421b";
                ctx.fillRect(-s, -s, s * 2, p);
                ctx.fillRect(-s, s - p, s * 2, p);
                ctx.fillRect(-s, -s, p, s * 2);
                ctx.fillRect(s - p, -s, p, s * 2);
                ctx.fillStyle = "#ff2222";
                ctx.fillRect(s - p * 3, -s + p * 2, p, p);
                ctx.fillRect(s - p * 3, s - p * 3, p, p);
                ctx.fillStyle = "#0f170e";
                ctx.fillRect(s - p * 2, -s + p * 3, p, p * 2);
                ctx.fillStyle = "#7a1a1a";
                ctx.fillRect(-s + p * 2, -s + p * 2, p * 3, p);
                ctx.fillRect(-s + p * 2, -s + p * 1, p, p * 3);
                ctx.fillRect(-s + p * 4, -s + p * 1, p, p * 3);
                ctx.restore();
                if (z.hp < z.maxHp) {
                    const w = z.size * 2;
                    ctx.fillStyle = "#400";
                    ctx.fillRect(z.x - w/2, z.y - z.size * z.fatness - 8, w, 4);
                    ctx.fillStyle = "#0f0";
                    ctx.fillRect(z.x - w/2, z.y - z.size * z.fatness - 8, w * (z.hp / z.maxHp), 4);
                }
            });

            const timeSinceLastShot = performance.now() - lastShootTime;
            if (timeSinceLastShot < shootCooldown) {
                const progress = timeSinceLastShot / shootCooldown;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 12, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
                ctx.strokeStyle = "rgba(255, 204, 0, 0.7)";
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function loop(time) { update(time); render(); requestAnimationFrame(loop); }

        function resetGame() {
            player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 };
            bullets = []; zombies = []; foodCans = 0; currentWave = 0;
            lastShootTime = 0; bulletSize = 4;
            gameOver = false; isShopOpen = false; waveState = "READY_TO_START";
            ownedWeapons = { pistol: true, shotgun: false, glizzy: false, water: false };
            currentWeapon = "pistol";
            shootCooldown = WEAPONS.pistol.cooldown;
            foodCansEl.innerText = foodCans;
            waveEl.innerText = 0;
            updateHealthBar();
            updateWeaponDisplay();
            gameoverEl.style.display = "none";
            waveBanner.style.opacity = "0";
            shopUiEl.classList.remove("active");
            document.getElementById("cheat-triggerbot").checked = false;
            document.getElementById("cheat-invisible").checked = false;
            hackTriggerbotActive = false;
            hackInvisibilityActive = false;
            document.getElementById("cheat-speed").value = 4;
            document.getElementById("cheat-speed-val").innerText = 4;
            document.getElementById("cheat-damage").value = 4;
            document.getElementById("cheat-damage-val").innerText = 4;
            document.getElementById("cheat-health").value = 100;
            document.getElementById("cheat-health-val").innerText = 100;
            closeCheatMenu();
        }

        updateWeaponDisplay();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
