<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Zhenanigans</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a0c;
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #1e1e24;
            background-color: #030303;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.05), inset 0 0 100px rgba(0,0,0,0.9);
            cursor: crosshair;
            border-radius: 4px;
        }
        #instructions {
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
            letter-spacing: 0.05em;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="instructions">
        <strong>WASD / Arrows</strong> to Move | <strong>Left Click & Hold</strong> to Shoot | <strong>R</strong> to Restart
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game State Variables
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 15,
    speed: 4,
    health: 100,
    foodCans: 0,
    lastShotTime: 0,
    shootCooldown: 500
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = []; 
let wave = 1;
let zombiesToSpawn = 5;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 1000;
let gameOver = false;

// Event Listeners for Controls
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') {
        resetGame();
    }
});
window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Classes
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 3 + 1;
        this.speed = Math.random() * 3 + 1;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

class Zombie {
    constructor(waveNumber) {
        const edges = ['top', 'bottom', 'left', 'right'];
        const chosenEdge = edges[Math.floor(Math.random() * edges.length)];
        
        if (chosenEdge === 'top') { this.x = Math.random() * canvas.width; this.y = -20; }
        else if (chosenEdge === 'bottom') { this.x = Math.random() * canvas.width; this.y = canvas.height + 20; }
        else if (chosenEdge === 'left') { this.x = -20; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + 20; this.y = Math.random() * canvas.height; }

        this.radius = 14;
        this.health = 20 + (waveNumber * 5);
        this.speed = 1.5 + Math.min(waveNumber * 0.2, 2.5);
        this.angle = 0;
    }

    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist !== 0) {
            this.angle = Math.atan2(dy, dx);
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Neon shadow glow for cyber zombie look
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#10b981";

        // Main Body (Dark Cyber Rot Green)
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#064e3b";
        ctx.strokeStyle = "#10b981";
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();

        // Remove glow effect for smaller details
        ctx.shadowBlur = 0;

        // Visual Zombie Details (Grabbing Hands)
        ctx.fillStyle = "#34d399";
        ctx.fillRect(this.radius - 2, -8, 6, 4);
        ctx.fillRect(this.radius - 2, 4, 6, 4);

        // Piercing Neon Yellow Eyes
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(5, -4, 2.5, 0, Math.PI * 2);
        ctx.arc(5, 4, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Bullet {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.radius = 3;
        this.speed = 12;
        this.damage = 25;

        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);

        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;
    }

    draw() {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#38bdf8";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#0ea5e9"; // Cyan laser projectile
        ctx.fill();
        ctx.restore();
    }
}

// Game Mechanics Engine
function handlePlayerMovement() {
    if ((keys['w'] || keys['arrowup']) && player.y > player.radius) player.y -= player.speed;
    if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.radius) player.y += player.speed;
    if ((keys['a'] || keys['arrowleft']) && player.x > player.radius) player.x -= player.speed;
    if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.radius) player.x += player.speed;
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new Bullet(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new Zombie(wave));
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }

    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 5;
        zombiesSpawned = 0;
    }
}

function checkCollisions() {
    // Bullet vs Zombie collision loop
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            const dist = Math.hypot(zombies[z].x - bullets[b].x, zombies[z].y - bullets[b].y);
            
            if (dist < zombies[z].radius + bullets[b].radius) {
                zombies[z].health -= bullets[b].damage;
                
                // Light hit splatters
                for (let i = 0; i < 4; i++) {
                    particles.push(new Particle(zombies[z].x, zombies[z].y, "#047857"));
                }

                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    // Massive elimination explosion burst
                    for (let i = 0; i < 12; i++) {
                        particles.push(new Particle(zombies[z].x, zombies[z].y, "#10b981"));
                    }
                    zombies.splice(z, 1);
                    player.foodCans++;
                }
                break;
            }
        }
    }

    // Zombie vs Player damage loop
    zombies.forEach(zombie => {
        const dist = Math.hypot(zombie.x - player.x, zombie.y - player.y);
        if (dist < zombie.radius + player.radius) {
            player.health -= 0.4;
            // Spawns friction hit sparks from the player's energy shields
            if (Math.random() < 0.3) {
                particles.push(new Particle(player.x, player.y, "#f43f5e"));
            }
            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    });
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.foodCans = 0;
    player.lastShotTime = 0;
    zombies = [];
    bullets = [];
    particles = [];
    wave = 1;
    zombiesToSpawn = 5;
    zombiesSpawned = 0;
    gameOver = false;
}

// Render Engine UI
function drawHUD() {
    ctx.font = "bold 16px 'Segoe UI', Arial, sans-serif";
    
    // Left side info strings
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("SURVIVAL WAVE", 20, 30);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(`${wave}`, 20, 58);
    
    ctx.font = "bold 15px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#fbbf24";
    ctx.fillText(`🥫 Cans Collected: ${player.foodCans}`, 20, 90);

    // Right side target tracker
    const remaining = (zombiesToSpawn - zombiesSpawned) + zombies.length;
    ctx.textAlign = "right";
    ctx.font = "bold 16px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("HOSTILES REMAINING", canvas.width - 20, 30);
    ctx.fillStyle = "#f43f5e";
    ctx.font = "bold 24px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(`${remaining}`, canvas.width - 20, 58);

    // Top Center Premium Sleek Health Bar
    const barWidth = 240;
    const barHeight = 12;
    const barX = (canvas.width / 2) - (barWidth / 2);
    const barY = 32;

    ctx.textAlign = "center";
    ctx.font = "bold 12px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText(`VITALS: ${Math.ceil(player.health)}%`, canvas.width / 2, barY - 8);

    // 1. Draw Background Track Container (Explicit Path Isolation)
    ctx.beginPath();
    ctx.fillStyle = "#1e1e24";
    ctx.roundRect(barX, barY, barWidth, barHeight, 6);
    ctx.fill();

    // 2. Draw Active Health Gauge (Explicit Path Isolation)
    if (player.health > 0) {
        ctx.save();
        ctx.beginPath(); // Crucial path separator to fix rendering bug
        
        // Dynamically shift coloring from Green to Warning Red
        const healthColor = player.health > 35 ? "#10b981" : "#ef4444"; 
        
        ctx.shadowBlur = 14;
        ctx.shadowColor = healthColor;
        ctx.fillStyle = healthColor;
        
        ctx.roundRect(barX, barY, barWidth * (player.health / 100), barHeight, 6);
        ctx.fill();
        ctx.restore();
    }

    ctx.textAlign = "left"; 
}

function drawPlayer() {
    ctx.save();
    const pAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.translate(player.x, player.y);
    ctx.rotate(pAngle);

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#f43f5e";

    // Shield outline ring
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#881337";
    ctx.strokeStyle = "#f43f5e";
    ctx.lineWidth = 2.5;
    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = 0;

    // Tactical Gun Arm Indicator
    ctx.fillStyle = "#fda4af";
    ctx.fillRect(player.radius - 4, -4, 10, 8);

    ctx.restore();
}

function drawGameOver() {
    ctx.fillStyle = "rgba(10, 10, 12, 0.9)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f43f5e";
    ctx.font = "bold 56px 'Segoe UI', Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#f43f5e";
    ctx.fillText("SYSTEM FAILURE", canvas.width / 2, canvas.height / 2 - 30);

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#94a3b8";
    ctx.font = "18px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(`You reached Wave ${wave} and extracted ${player.foodCans} supplies.`, canvas.width / 2, canvas.height / 2 + 25);
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px 'Segoe UI', Arial, sans-serif";
    ctx.fillText("PRESS 'R' TO REBOOT TERMINAL", canvas.width / 2, canvas.height / 2 + 75);
    ctx.textAlign = "left";
}

// Master Loop
function gameLoop() {
    const currentTime = performance.now();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handlePlayerMovement();
        handleShooting(currentTime);
        spawnLogic(currentTime);
        checkCollisions();

        bullets = bullets.filter(b => b.x >= 0 && b.x <= canvas.width && b.y >= 0 && b.y <= canvas.height);
        particles = particles.filter(p => p.alpha > 0);

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        bullets.forEach(bullet => {
            bullet.update();
            bullet.draw();
        });

        zombies.forEach(zombie => {
            zombie.update();
            zombie.draw();
        });

        drawPlayer();
        drawHUD();
    } else {
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

// Initialize Game
gameLoop();
</script>
</body>
</html>
