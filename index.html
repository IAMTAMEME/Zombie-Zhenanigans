<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Zombie Zhenanigans</title> 
    <style> 
        body { 
            margin: 0; 
            background-color: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        } 
        #ui { 
            margin-bottom: 20px; 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            text-align: center; 
            width: 800px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 10px; 
        } 
        .hp-label { 
            margin-right: 12px; 
            letter-spacing: 1px; 
        } 
        #health-container { 
            width: 200px; 
            height: 20px; 
            background-color: #444; 
            border: 2px solid #555; 
            border-radius: 3px; 
            overflow: hidden; 
        } 
        #health-bar { 
            width: 100%; 
            height: 100%; 
            background-color: #00ff66; 
            transition: width 0.1s ease; 
        } 
        #game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            position: relative;
        }
        canvas { 
            background-color: #1a1a1a; 
            border: 4px solid #333; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); 
            cursor: crosshair; 
        } 
        /* Shop Sidebar Styles */
        #shop-panel {
            width: 220px;
            background: #222;
            border: 4px solid #444;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .shop-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            text-align: center;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }
        .shop-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .shop-item-info {
            font-size: 13px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }
        .shop-btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 6px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            transition: background 0.2s;
        }
        .shop-btn:hover {
            background: #0052cc;
        }
        .shop-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        #gameover { 
            display: none; 
            position: absolute; 
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px; 
            color: #ff3333; 
            font-weight: bold; 
            text-shadow: 2px 2px #000; 
            text-align: center; 
            line-height: 1.6; 
            background: rgba(17, 17, 17, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff3333;
            z-index: 10;
        } 
        #restart { 
            margin-top: 25px; 
            padding: 12px 24px; 
            font-size: 18px; 
            background: #ff3333; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 5px; 
            letter-spacing: 1px; 
        } 
        #wave-banner { 
            position: absolute; 
            left: 35%;
            top: 45%;
            font-size: 64px; 
            color: #ffcc00; 
            font-weight: bold; 
            text-shadow: 3px 3px #000; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            pointer-events: none; 
            letter-spacing: 4px; 
            z-index: 5;
        } 
    </style> 
</head> 
<body> 
    <div id="ui"> 
        <div>ZOMBIE ZHENGANINZANS</div> 
        <div style="display: flex; align-items: center;"> 
            <span class="hp-label">HP:</span> 
            <div id="health-container"><div id="health-bar"></div></div> 
        </div> 
        <div>Wave: <span id="wave">0</span></div> 
        <div>Food-cans: 🥫 <span id="foodCans">0</span></div> 
    </div> 

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas> 

        <!-- Side Shop UI -->
        <div id="shop-panel">
            <div class="shop-title">🥫 SURVIVAL SHOP</div>
            
            <div class="shop-item">
                <div class="shop-item-info"><span>+10 Max HP</span> <span id="cost-hp">Cost: 5</span></div>
                <button class="shop-btn" id="btn-hp" onclick="buyUpgrade('hp')">Upgrade Health</button>
            </div>

            <div class="shop-item">
                <div class="shop-item-info"><span>+0.5 Speed</span> <span id="cost-speed">Cost: 8</span></div>
                <button class="shop-btn" id="btn-speed" onclick="buyUpgrade('speed')">Upgrade Speed</button>
            </div>

            <div class="shop-item">
                <div class="shop-item-info"><span>-50ms Fire Rate</span> <span id="cost-firerate">Cost: 10</span></div>
                <button class="shop-btn" id="btn-firerate" onclick="buyUpgrade('firerate')">Upgrade Gun</button>
            </div>
            
            <div style="font-size: 11px; color: #777; text-align: center; margin-top: 5px;">
                Upgrades apply instantly!
            </div>
        </div>

        <div id="wave-banner">WAVE 1</div> 
        <div id="gameover"> 
            GAME OVER <br> 
            <button id="restart" onclick="resetGame()">Try Again</button> 
        </div> 
    </div>

    <script> 
        const canvas = document.getElementById("gameCanvas"); 
        const ctx = canvas.getContext("2d"); 
        const foodCansEl = document.getElementById("foodCans"); 
        const waveEl = document.getElementById("wave"); 
        const healthBarEl = document.getElementById("health-bar"); 
        const gameoverEl = document.getElementById("gameover"); 
        const waveBanner = document.getElementById("wave-banner"); 

        // Game State 
        let player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 }; 
        let bullets = []; 
        let zombies = []; 
        let keys = {}; 
        let mouse = { x: 0, y: 0 }; 
        let isMouseDown = false; 
        let foodCans = 0; 
        let gameOver = false; 

        // Upgrade Costs and Tracks
        let shootCooldown = 500; 
        let lastShootTime = 0; 
        
        let costs = { hp: 5, speed: 8, firerate: 10 };

        let currentWave = 0; 
        let waveState = "READY_TO_START"; 

        let lastHitTime = 0; 
        const hitCooldown = 400; 

        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true); 
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false); 

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect(); 
            mouse.x = e.clientX - rect.left; 
            mouse.y = e.clientY - rect.top; 
        }); 

        // Block canvas shooting when clicking inside the shop area
        canvas.addEventListener("mousedown", () => isMouseDown = true); 
        window.addEventListener("mouseup", () => isMouseDown = false); 

        function shoot() { 
            const currentTime = performance.now(); 
            if (currentTime - lastShootTime >= shootCooldown) { 
                let dx = mouse.x - player.x; 
                let dy = mouse.y - player.y; 
                let angle = Math.atan2(dy, dx); 
                bullets.push({ 
                    x: player.x, 
                    y: player.y, 
                    vx: Math.cos(angle) * 8, 
                    vy: Math.sin(angle) * 8, 
                    size: 4 
                }); 
                lastShootTime = currentTime; 
            } 
        } 

        // Shop purchase handling logic
        function buyUpgrade(type) {
            if (foodCans < costs[type] || gameOver) return;

            foodCans -= costs[type];
            foodCansEl.innerText = foodCans;

            if (type === 'hp') {
                player.maxHp += 10;
                player.hp = Math.min(player.hp + 25, player.maxHp); // Heal slightly on upgrade
                costs.hp = Math.floor(costs.hp * 1.5);
                document.getElementById("cost-hp").innerText = `Cost: ${costs.hp}`;
            } else if (type === 'speed') {
                player.speed += 0.5;
                costs.speed = Math.floor(costs.speed * 1.6);
                document.getElementById("cost-speed").innerText = `Cost: ${costs.speed}`;
            } else if (type === 'firerate') {
                shootCooldown = Math.max(100, shootCooldown - 50); // Cap fire rate speed limit at 100ms
                costs.firerate = Math.floor(costs.firerate * 1.8);
                document.getElementById("cost-firerate").innerText = `Cost: ${costs.firerate}`;
                if (shootCooldown <= 100) {
                    document.getElementById("cost-firerate").innerText = "MAXED";
                }
            }
            updateShopButtons();
            updateHealthBar();
        }

        function updateShopButtons() {
            document.getElementById("btn-hp").disabled = (foodCans < costs.hp);
            document.getElementById("btn-speed").disabled = (foodCans < costs.speed);
            document.getElementById("btn-firerate").disabled = (foodCans < costs.firerate || shootCooldown <= 100);
        }

        function updateHealthBar() {
            let percentage = (player.hp / player.maxHp) * 100;
            healthBarEl.style.width = `${Math.max(0, percentage)}%`;
        }

        function startNextWave() { 
            waveState = "SPAWNING"; 
            currentWave++; 
            waveEl.innerText = currentWave; 
            waveBanner.innerText = `WAVE ${currentWave}`; 
            waveBanner.style.opacity = "1"; 

            setTimeout(() => { 
                if (gameOver) return; 
                waveBanner.style.opacity = "0"; 
                let zombieCount = currentWave * 3; 
                for (let i = 0; i < zombieCount; i++) { 
                    spawnZombie(); 
                } 
                waveState = "FIGHTING"; 
            }, 2000); 
        } 

        function spawnZombie() { 
            let x, y; 
            if (Math.random() < 0.5) { 
                x = Math.random() < 0.5 ? -30 : canvas.width + 30; 
                y = Math.random() * canvas.height; 
            } else { 
                x = Math.random() * canvas.width; 
                y = Math.random() < 0.5 ? -30 : canvas.height + 30; 
            } 
            let speedBonus = Math.min(1.0, currentWave * 0.08); 
            zombies.push({ 
                x: x, 
                y: y, 
                size: 16, 
                speed: 0.8 + Math.random() + speedBonus, 
                angle: 0 
            }); 
        } 

        function update() { 
            if (gameOver) return; 

            if (zombies.length === 0 && waveState === "READY_TO_START") { 
                startNextWave(); 
            } 

            // Handle active button triggers on dynamic point updates
            updateShopButtons();

            if (keys['w'] || keys['arrowup']) player.y -= player.speed; 
            if (keys['s'] || keys['arrowdown']) player.y += player.speed; 
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed; 
            if (keys['d'] || keys['arrowright']) player.x += player.speed; 

            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x)); 
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y)); 
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x); 

            if (isMouseDown && mouse.x >= 0 && mouse.x <= canvas.width && mouse.y >= 0 && mouse.y <= canvas.height) {
                shoot();
            }

            for (let i = bullets.length - 1; i >= 0; i--) { 
                let b = bullets[i]; 
                b.x += b.vx; 
                b.y += b.vy; 
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) { 
                    bullets.splice(i, 1); 
                } 
            } 

            const currentTime = performance.now();
            for (let i = zombies.length - 1; i >= 0; i--) { 
                let z = zombies[i]; 
                let dx = player.x - z.x; 
                let dy = player.y - z.y; 
                let dist = Math.hypot(dx, dy); 

                z.angle = Math.atan2(dy, dx);
                z.x += (dx / dist) * z.speed; 
                z.y += (dy / dist) * z.speed; 

                if (dist < player.size + z.size) {
                    if (currentTime - lastHitTime >= hitCooldown) {
                        player.hp -= 10;
                        lastHitTime = currentTime;
                        updateHealthBar();
                        if (player.hp <= 0) {
                            endGame();
                        }
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let bDx = b.x - z.x;
                    let bDy = b.y - z.y;
                    let bDist = Math.hypot(bDx, bDy);

                    if (bDist < z.size + b.size) {
                        zombies.splice(i, 1);
                        bullets.splice(j, 1);
                        foodCans += 1;
                        foodCansEl.innerText = foodCans;
                        break;
                    }
                }
            } 

            if (zombies.length === 0 && waveState === "FIGHTING") {
                waveState = "READY_TO_START";
            }
        } 

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fillStyle = "#ffcc00";
                ctx.fill();
            });

            zombies.forEach(z => {
                ctx.save();
                ctx.translate(z.x, z.y);
                ctx.rotate(z.angle);
                ctx.fillStyle = "#4d7c0f";
                ctx.beginPath();
                ctx.arc(0, 0, z.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#65a30d";
                ctx.fillRect(5, -12, 10, 6);
                ctx.fillRect(5, 6, 10, 6);
                ctx.restore();
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = "#555";
            ctx.fillRect(10, -4, 18, 8);
            ctx.fillStyle = "#0066ff";
            ctx.beginPath();
            ctx.arc(0, 0, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            gameOver = true;
            gameoverEl.style.display = "block";
        }

        function resetGame() {
            player.maxHp = 100;
            player.hp = 100;
            player.x = 400;
            player.y = 300;
            player.speed = 4;
            shootCooldown = 500;
            
            costs = { hp: 5, speed: 8, firerate: 10 };
            document.getElementById("cost-hp").innerText = "Cost: 5";
            document.getElementById("cost-speed").innerText = "Cost: 8";
            document.getElementById("cost-firerate").innerText = "Cost: 10";

            bullets = [];
            zombies = [];
            foodCans = 0;
            currentWave = 0;
            gameOver = false;
            waveState = "READY_TO_START";
            
            foodCansEl.innerText = "0";
            updateHealthBar();
            gameoverEl.style.display = "none";
            
            gameLoop();
        }

        gameLoop();
    </script> 
</body> 
</html>
