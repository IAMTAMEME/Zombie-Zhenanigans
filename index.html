<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Zenganinzans</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Spaced out the text elements across the top bar */
        #ui {
            margin-bottom: 20px; /* More space between text and game window */
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px; /* Extra letter spacing for cleaner reading */
            text-align: center;
            width: 800px;
            display: flex;
            justify-content: space-between; /* Evenly spaces elements left-to-right */
            align-items: center;
            padding: 0 10px;
        }
        /* Spacing for the HP text layout */
        .hp-label {
            margin-right: 12px;
            letter-spacing: 1px;
        }
        #health-container {
            width: 200px;
            height: 20px;
            background-color: #444;
            border: 2px solid #555;
            border-radius: 3px;
            overflow: hidden;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #00ff66;
            transition: width 0.1s ease;
        }
        canvas {
            background-color: #1a1a1a;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
        }
        #gameover {
            display: none;
            position: absolute;
            font-size: 48px;
            color: #ff3333;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            text-align: center;
            line-height: 1.6; /* Balanced line spacing for the game over text */
        }
        #restart {
            margin-top: 25px; /* More breathing room above the button */
            padding: 12px 24px;
            font-size: 18px;
            background: #ff3333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            letter-spacing: 1px;
        }
        #wave-banner {
            position: absolute;
            font-size: 64px;
            color: #ffcc00;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            letter-spacing: 4px; /* Spaced out massive announcement text */
        }
    </style>
</head>
<body>

    <!-- Clear, spaced out HUD interface -->
    <div id="ui">
        <div>ZOMBIE ZENGANINZANS</div>
        <div style="display: flex; align-items: center;">
            <span class="hp-label">HP:</span>
            <div id="health-container"><div id="health-bar"></div></div>
        </div>
        <div>Wave: <span id="wave">0</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="wave-banner">WAVE 1</div>

    <div id="gameover">
        GAME OVER
        <br>
        <button id="restart" onclick="resetGame()">Try Again</button>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const waveEl = document.getElementById("wave");
const healthBarEl = document.getElementById("health-bar");
const gameoverEl = document.getElementById("gameover");
const waveBanner = document.getElementById("wave-banner");

// Game State
let player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 };
let bullets = [];
let zombies = [];
let keys = {};
let mouse = { x: 0, y: 0 };
let score = 0;
let gameOver = false;

// Wave Logic Variables
let currentWave = 0;
let waveState = "READY_TO_START"; 

// Invincibility frame timer so player doesn't instantly melt
let lastHitTime = 0;
const hitCooldown = 400; 

// Track Inputs
window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => {
    if (!gameOver) shoot();
});

function shoot() {
    let dx = mouse.x - player.x;
    let dy = mouse.y - player.y;
    let angle = Math.atan2(dy, dx);
    
    bullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 8,
        vy: Math.sin(angle) * 8,
        size: 4
    });
}

function startNextWave() {
    waveState = "SPAWNING"; 
    currentWave++;
    waveEl.innerText = currentWave;
    
    waveBanner.innerText = `WAVE ${currentWave}`;
    waveBanner.style.opacity = "1";

    setTimeout(() => {
        if (gameOver) return; 
        
        waveBanner.style.opacity = "0";
        
        let zombieCount = currentWave * 3; 
        
        for (let i = 0; i < zombieCount; i++) {
            spawnZombie();
        }
        
        waveState = "FIGHTING";
    }, 2000);
}

function spawnZombie() {
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
    }
    
    let speedBonus = Math.min(1.0, currentWave * 0.08); 
    zombies.push({ 
        x: x, 
        y: y, 
        size: 15, 
        speed: 0.8 + Math.random() + speedBonus 
    });
}

function update(time) {
    if (gameOver) return;

    if (zombies.length === 0 && waveState === "READY_TO_START") {
        startNextWave();
    }

    // Player Movement System
    if (keys['w'] || keys['arrowup']) player.y -= player.speed;
    if (keys['s'] || keys['arrowdown']) player.y += player.speed;
    if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
    if (keys['d'] || keys['arrowright']) player.x += player.speed;

    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    // Bullet Updates
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }

    // Zombie Logic Loop
    for (let i = zombies.length - 1; i >= 0; i--) {
        let z = zombies[i];
        let dx = player.x - z.x;
        let dy = player.y - z.y;
        let dist = Math.hypot(dx, dy);

        // Move toward player
        z.x += (dx / dist) * z.speed;
        z.y += (dy / dist) * z.speed;

        // Player collision check with damage system
        if (dist < player.size + z.size) {
            if (time - lastHitTime > hitCooldown) {
                player.hp -= 20; 
                lastHitTime = time;
                
                let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
                healthBarEl.style.width = hpPercent + "%";
                
                if (hpPercent < 30) healthBarEl.style.backgroundColor = "#ff3333";
                else if (hpPercent < 60) healthBarEl.style.backgroundColor = "#ff9900";

                if (player.hp <= 0) {
                    gameOver = true;
                    gameoverEl.style.display = "block";
                }
            }
        }

        // Bullet collision check
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            let bDist = Math.hypot(b.x - z.x, b.y - z.y);
            if (bDist < z.size + b.size) {
                zombies.splice(i, 1);
                bullets.splice(j, 1);
                score += 10;
                scoreEl.innerText = score;
                break;
            }
        }
    }

    if (zombies.length === 0 && waveState === "FIGHTING") {
        waveState = "READY_TO_START";
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Player Body and Gun Direction
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = "#3388ff";
    ctx.beginPath();
    ctx.arc(0, 0, player.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#555";
    ctx.fillRect(0, -4, 25, 8);
    ctx.restore();

    // Draw Projectiles
    ctx.fillStyle = "#ffcc00";
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Active Zombie Horde
    ctx.fillStyle = "#a83232";
    zombies.forEach(z => {
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillRect(z.x - 3, z.y - 3, 2, 2);
        ctx.fillRect(z.x + 1, z.y - 3, 2, 2);
        ctx.fillStyle = "#a83232";
    });
}

function loop(time) {
    update(time);
    render();
    requestAnimationFrame(loop);
}

function resetGame() {
    player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 };
    bullets = [];
    zombies = [];
    score = 0;
    currentWave = 0;
    gameOver = false;
    waveState = "READY_TO_START";
    scoreEl.innerText = score;
    waveEl.innerText = 0;
    healthBarEl.style.width = "100%";
    healthBarEl.style.backgroundColor = "#00ff66";
    gameoverEl.style.display = "none";
    waveBanner.style.opacity = "0";
}

// Initial engine kickoff
requestAnimationFrame(loop);
</script>

</body>
</html>

</body>
</html>
