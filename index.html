<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Zombie Zhenanigans</title> 
    <style> 
        body { 
            margin: 0; 
            background-color: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        } 
        #ui { 
            margin-bottom: 20px; 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            text-align: center; 
            width: 800px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 10px; 
        } 
        .hp-label { 
            margin-right: 12px; 
            letter-spacing: 1px; 
        } 
        #health-container { 
            width: 200px; 
            height: 20px; 
            background-color: #444; 
            border: 2px solid #555; 
            border-radius: 3px; 
            overflow: hidden; 
        } 
        #health-bar { 
            width: 100%; 
            height: 100%; 
            background-color: #00ff66; 
            transition: width 0.1s ease; 
        } 
        canvas { 
            background-color: #1a1a1a; 
            border: 4px solid #333; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); 
            cursor: crosshair; 
        } 
        #gameover { 
            display: none; 
            position: absolute; 
            font-size: 48px; 
            color: #ff3333; 
            font-weight: bold; 
            text-shadow: 2px 2px #000; 
            text-align: center; 
            line-height: 1.6; 
        } 
        #restart { 
            margin-top: 25px; 
            padding: 12px 24px; 
            font-size: 18px; 
            background: #ff3333; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 5px; 
            letter-spacing: 1px; 
        } 
        #wave-banner { 
            position: absolute; 
            font-size: 64px; 
            color: #ffcc00; 
            font-weight: bold; 
            text-shadow: 3px 3px #000; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            pointer-events: none; 
            letter-spacing: 4px; 
        } 
    </style> 
</head> 
<body> 
    <div id="ui"> 
        <div>ZOMBIE ZHENANIGANS</div> 
        <div style="display: flex; align-items: center;"> 
            <span class="hp-label">HP:</span> 
            <div id="health-container"><div id="health-bar"></div></div> 
        </div> 
        <div>Wave: <span id="wave">0</span></div> 
        <div>Food-cans: 🥫 <span id="foodCans">0</span></div> 
    </div> 

    <canvas id="gameCanvas" width="800" height="600"></canvas> 

    <div id="wave-banner">WAVE 1</div> 
    <div id="gameover"> 
        GAME OVER <br> 
        <button id="restart" onclick="resetGame()">Try Again</button> 
    </div> 

    <script> 
        const canvas = document.getElementById("gameCanvas"); 
        const ctx = canvas.getContext("2d"); 
        const foodCansEl = document.getElementById("foodCans"); 
        const waveEl = document.getElementById("wave"); 
        const healthBarEl = document.getElementById("health-bar"); 
        const gameoverEl = document.getElementById("gameover"); 
        const waveBanner = document.getElementById("wave-banner"); 

        // Game State 
        let player = { x: 400, y: 300, size: 20, speed: 4, angle: 0, maxHp: 100, hp: 100 }; 
        let bullets = []; 
        let zombies = []; 
        let keys = {}; 
        let mouse = { x: 0, y: 0 }; 
        let foodCans = 0; 
        let gameOver = false; 

        // CHANGED: Changed to 'let' so you can modify this values down the line
        let shootCooldown = 2000; // Set to 2000ms as requested
        let lastShootTime = 0; 

        let currentWave = 0; 
        let waveState = "READY_TO_START"; 

        let lastHitTime = 0; 
        const hitCooldown = 400; 

        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true); 
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false); 

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect(); 
            mouse.x = e.clientX - rect.left; 
            mouse.y = e.clientY - rect.top; 
        }); 

        canvas.addEventListener("mousedown", () => { 
            if (!gameOver) shoot(); 
        }); 

        function shoot() { 
            const currentTime = performance.now(); 
            if (currentTime - lastShootTime >= shootCooldown) { 
                let dx = mouse.x - player.x; 
                let dy = mouse.y - player.y; 
                let angle = Math.atan2(dy, dx); 
                bullets.push({ 
                    x: player.x, 
                    y: player.y, 
                    vx: Math.cos(angle) * 8, 
                    vy: Math.sin(angle) * 8, 
                    size: 4 
                }); 
                lastShootTime = currentTime; 
            } 
        } 

        function startNextWave() { 
            waveState = "SPAWNING"; 
            currentWave++; 
            waveEl.innerText = currentWave; 
            waveBanner.innerText = `WAVE ${currentWave}`; 
            waveBanner.style.opacity = "1"; 

            setTimeout(() => { 
                if (gameOver) return; 
                waveBanner.style.opacity = "0"; 
                let zombieCount = currentWave * 3; 
                for (let i = 0; i < zombieCount; i++) { 
                    spawnZombie(); 
                } 
                waveState = "FIGHTING"; 
            }, 2000); 
        } 

        function spawnZombie() { 
            let x, y; 
            if (Math.random() < 0.5) { 
                x = Math.random() < 0.5 ? -30 : canvas.width + 30; 
                y = Math.random() * canvas.height; 
            } else { 
                x = Math.random() * canvas.width; 
                y = Math.random() < 0.5 ? -30 : canvas.height + 30; 
            } 
            let speedBonus = Math.min(1.0, currentWave * 0.08); 
            zombies.push({ 
                x: x, 
                y: y, 
                size: 16, 
                speed: 0.8 + Math.random() + speedBonus, 
                angle: 0,
                health: 20 // Added health property for zombie death calculations
            }); 
        } 

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;
            bullets = [];
            zombies = [];
            foodCans = 0;
            currentWave = 0;
            waveState = "READY_TO_START";
            gameOver = false;
            gameoverEl.style.display = "none";
            foodCansEl.innerText = foodCans;
            healthBarEl.style.width = "100%";
        }

        // Main game Loop Engine
        function loop(time) { 
            if (gameOver) return requestAnimationFrame(loop); 

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (zombies.length === 0 && waveState === "READY_TO_START") { 
                startNextWave(); 
            } 

            // Player Movement Controls
            if (keys['w'] || keys['arrowup']) player.y -= player.speed; 
            if (keys['s'] || keys['arrowdown']) player.y += player.speed; 
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed; 
            if (keys['d'] || keys['arrowright']) player.x += player.speed; 

            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x)); 
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y)); 
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x); 

            // Bullet Engine Processing Loop
            for (let i = bullets.length - 1; i >= 0; i--) { 
                let b = bullets[i]; 
                b.x += b.vx; 
                b.y += b.vy; 
                
                // Draw bullets
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) { 
                    bullets.splice(i, 1); 
                    continue;
                } 

                // Bullet hit zombie collision check
                for (let j = zombies.length - 1; j >= 0; j--) {
                    let z = zombies[j];
                    if (Math.hypot(b.x - z.x, b.y - z.y) < b.size + z.size) {
                        zombies.splice(j, 1);
                        bullets.splice(i, 1);
                        
                        // 40% chance drop food can
                        if (Math.random() < 0.4) {
                            foodCans++;
                            foodCansEl.innerText = foodCans;
                        }
                        break;
                    }
                }
            } 

            // Zombie Engine Processing Loop
            for (let i = zombies.length - 1; i >= 0; i--) { 
                let z = zombies[i]; 
                let dx = player.x - z.x; 
                let dy = player.y - z.y; 
                let dist = Math.hypot(dx, dy); 

                z.x += (dx / dist) * z.speed; 
                z.y += (dy / dist) * z.speed; 
                z.angle = Math.atan2(dy, dx); 

                // Draw standard green circles for zombies
                ctx.save();
                ctx.translate(z.x, z.y);
                ctx.rotate(z.angle);
                ctx.fillStyle = "#4a6b52";
                ctx.beginPath();
                ctx.arc(0, 0, z.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Player damage check
                if (dist < player.size + z.size) { 
                    if (time - lastHitTime >= hitCooldown) { 
                        player.hp -= 10;
                        healthBarEl.style.width = `${Math.max(0, player.hp)}%`;
                        lastHitTime = time;
                        
                        if (player.hp <= 0) {
                            gameOver = true;
                            gameoverEl.style.display = "block";
                        }
                    } 
                } 
            } 

            // Trigger next wave if wave cleared out
            if (zombies.length === 0 && waveState === "FIGHTING") {
                waveState = "READY_TO_START";
            }

            // Draw player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = "#3498db";
            ctx.beginPath();
            ctx.arc(0, 0, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#555";
            ctx.fillRect(5, -3, 15, 6);
            ctx.restore();

            requestAnimationFrame(loop);
        } 

        // Start animation processing frame
        requestAnimationFrame(loop);
    </script> 
</body> 
</html>
