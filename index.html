<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse - Retro Arcade Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #33ff33; /* Neon retro green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui-wrapper {
            position: relative;
            border: 4px solid #33ff33; /* Retro neon terminal frame */
            box-shadow: 0 0 25px #33ff33;
        }
        canvas {
            background-color: #05080c; 
            image-rendering: pixelated;
            cursor: crosshair;
            display: block;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #33ff33;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            letter-spacing: 2px;
            line-height: 1.4;
        }
        /* Massive, Ultra-Visible Retro Canvas Health Bar */
        #health-container {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 250px;
            height: 24px;
            background-color: #111;
            border: 3px solid #33ff33;
            box-shadow: 0 0 10px #33ff33;
            pointer-events: none;
            padding: 2px;
            box-sizing: border-box;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #33ff33; /* Green retro bar */
            box-shadow: 0 0 8px #33ff33;
        }
        #instructions {
            margin-top: 15px;
            color: #33ff33;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            text-shadow: 0 0 5px #33ff33;
        }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud"></div>
        <div id="health-container">
            <div id="health-bar"></div>
        </div>
    </div>
    <div id="instructions">
        [WASD] Move | [Left Click] Laser Fire | [R] Reboot System
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const healthBar = document.getElementById("health-bar");
ctx.imageSmoothingEnabled = false;

// Game State Variables
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 24,
    speed: 3.8,
    health: 100,
    maxHealth: 100,
    kills: 0,
    lastShotTime: 0,
    shootCooldown: 180
};

let keys = {};
let mouse = { x: 0, y: 0, isPressed: false };
let zombies = [];
let bullets = [];
let particles = []; 
let wave = 1;
let zombiesToSpawn = 6;
let zombiesSpawned = 0;
let lastSpawnTime = 0;
let spawnDelay = 1000;
let gameOver = false;

// Event Listeners
window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (gameOver && e.key.toLowerCase() === 'r') resetGame();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener("mousedown", () => mouse.isPressed = true);
canvas.addEventListener("mouseup", () => mouse.isPressed = false);

// Classes
class RetroParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.floor(Math.random() * 3) + 3;
        this.speed = Math.random() * 4 + 2;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.04 + 0.03;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

class RetroCubeZombie {
    constructor(waveNumber) {
        const edges = ['top', 'bottom', 'left', 'right'];
        const chosenEdge = edges[Math.floor(Math.random() * edges.length)];
        
        if (chosenEdge === 'top') { this.x = Math.random() * canvas.width; this.y = -30; }
        else if (chosenEdge === 'bottom') { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
        else if (chosenEdge === 'left') { this.x = -30; this.y = Math.random() * canvas.height; }
        else { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }

        this.size = 24;
        this.health = 20 + (waveNumber * 6);
        this.speed = 1.3 + Math.min(waveNumber * 0.15, 2.3);
        this.angle = 0;
    }
    update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist !== 0) {
            this.angle = Math.atan2(dy, dx);
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
    draw() {
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        ctx.rotate(this.angle);

        // 1. Black outer shadow line
        ctx.fillStyle = "#000000";
        ctx.fillRect(-14, -14, 28, 28);

        // 2. Thick Green Outline
        ctx.fillStyle = "#33ff33"; 
        ctx.fillRect(-12, -12, 24, 24);

        // 3. Dark interior fill to leave the green border visible (Cube Style)
        ctx.fillStyle = "#0c140c";
        ctx.fillRect(-9, -9, 18, 18); 

        // 4. Black Scars running through the cube
        ctx.fillStyle = "#000000";
        ctx.fillRect(-5, -5, 10, 2);  
        ctx.fillRect(2, -2, 2, 8);    
        ctx.fillRect(-7, 3, 6, 2);    

        // 5. Glowing Neon Red Eyes
        ctx.fillStyle = "#ff3333";
        ctx.fillRect(2, -6, 4, 4);
        ctx.fillRect(2, 2, 4, 4);

        ctx.restore();
    }
}

class RetroLaser {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.size = 6;
        this.speed = 16;
        this.damage = 25;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.hypot(dx, dy);
        this.dx = dist !== 0 ? (dx / dist) * this.speed : this.speed;
        this.dy = dist !== 0 ? (dy / dist) * this.speed : 0;
    }
    update() {
        this.x += this.dx;
        this.y += this.dy;
    }
    draw() {
        ctx.save();
        // High-vis bright yellow-cyan beam block
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
    }
}

// Engine Functions
function drawPlayer() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.save();
    ctx.translate(Math.floor(player.x), Math.floor(player.y));
    ctx.rotate(angle);

    // Outline
    ctx.fillStyle = "#000000";
    ctx.fillRect(-14, -14, 28, 28);

    // Neon Cyan Retro Player Ship/Cube
    ctx.fillStyle = "#00ffff"; 
    ctx.fillRect(-12, -12, 24, 24);
    
    // Core design detailing
    ctx.fillStyle = "#000000";
    ctx.fillRect(-8, -8, 16, 16);
    ctx.fillStyle = "#00ffff";
    ctx.fillRect(-4, -4, 8, 8);

    // Blaster Barrel
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(8, -3, 12, 6);

    ctx.restore();
}

function handlePlayerMovement() {
    const halfSize = player.size / 2;
    if ((keys['w'] || keys['arrowup']) && player.y > halfSize) player.y -= player.speed;
    if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - halfSize) player.y += player.speed;
    if ((keys['a'] || keys['arrowleft']) && player.x > halfSize) player.x -= player.speed;
    if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - halfSize) player.x += player.speed;
}

function handleShooting(currentTime) {
    if (mouse.isPressed && (currentTime - player.lastShotTime >= player.shootCooldown)) {
        bullets.push(new RetroLaser(player.x, player.y, mouse.x, mouse.y));
        player.lastShotTime = currentTime;
    }
}

function spawnLogic(currentTime) {
    if (zombiesSpawned < zombiesToSpawn) {
        if (currentTime - lastSpawnTime >= spawnDelay) {
            zombies.push(new RetroCubeZombie(wave));
            zombiesSpawned++;
            lastSpawnTime = currentTime;
        }
    }
    if (zombies.length === 0 && zombiesSpawned >= zombiesToSpawn) {
        wave++;
        zombiesToSpawn = wave * 6;
        zombiesSpawned = 0;
        spawnDelay = Math.max(350, spawnDelay - 120);
    }
}

function checkCollisions() {
    // Laser vs Zombie Outbreak
    for (let b = bullets.length - 1; b >= 0; b--) {
        for (let z = zombies.length - 1; z >= 0; z--) {
            const dist = Math.hypot(bullets[b].x - zombies[z].x, bullets[b].y - zombies[z].y);
            if (dist < (bullets[b].size / 2 + zombies[z].size / 2)) {
                
                // Neon spark splash effects
                for (let i = 0; i < 6; i++) {
                    particles.push(new RetroParticle(zombies[z].x, zombies[z].y, "#ff3333"));
                }
                
                zombies[z].health -= bullets[b].damage;
                bullets.splice(b, 1);

                if (zombies[z].health <= 0) {
                    for (let i = 0; i < 12; i++) {
                        particles.push(new RetroParticle(zombies[z].x, zombies[z].y, "#33ff33"));
                    }
                    zombies.splice(z, 1);
                    player.kills++;
                }
                break;
            }
        }
    }

    // Zombie vs Player Ingress
    for (let z = zombies.length - 1; z >= 0; z--) {
        const dist = Math.hypot(player.x - zombies[z].x, player.y - zombies[z].y);
        if (dist < (player.size / 2 + zombies[z].size / 2)) {
            player.health -= 0.6; // Consistent scaling damage track
            
            // Cyber damage glitch bits
            if (Math.random() > 0.8) {
                particles.push(new RetroParticle(player.x, player.y, "#00ffff"));
            }
            if (player.health <= 0) {
                player.health = 0;
                gameOver = true;
            }
        }
    }
}

function updateUI() {
    hud.innerHTML = `SYSTEM WAVE: 0${wave}<br>THREATS DOWN: ${player.kills}`;
    
    // Update structural width sizing
    healthBar.style.width = `${Math.max(0, player.health)}%`;
    
    // Dynamic Retro Color Swapping based on critically low systems
    if (player.health > 45) {
        healthBar.style.backgroundColor = "#33ff33";
        healthBar.style.boxShadow = "0 0 8px #33ff33";
    } else if (player.health > 20) {
        healthBar.style.backgroundColor = "#ffcc00";
        healthBar.style.boxShadow = "0 0 8px #ffcc00";
    } else {
        healthBar.style.backgroundColor = "#ff3333";
        healthBar.style.boxShadow = "0 0 8px #ff3333";
    }
}

function resetGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.health = 100;
    player.kills = 0;
    wave = 1;
    zombiesToSpawn = 6;
    zombiesSpawned = 0;
    spawnDelay = 1000;
    zombies = [];
    bullets = [];
    particles = [];
    gameOver = false;
}

function loop(timestamp) {
    // Retro motion blur trail frame clear
    ctx.fillStyle = "rgba(5, 8, 12, 0.35)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        handlePlayerMovement();
        handleShooting(timestamp);
        spawnLogic(timestamp);
        checkCollisions();

        // Laser Tracking
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
            }
        }

        // Zombie Engine Processing
        zombies.forEach(zombie => {
            zombie.update();
            zombie.draw();
        });

        drawPlayer();
    } else {
        // Neon Game Over Terminal Matrix
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "bold 40px 'Courier New'";
        ctx.fillStyle = "#ff3333";
        ctx.textAlign = "center";
        ctx.fillText("CRITICAL SYSTEM FAILURE", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = "18px 'Courier New'";
        ctx.fillStyle = "#33ff33";
        ctx.fillText(`WAVES DEPLOYED: 0${wave}  |  CUBES TERMINATED: ${player.kills}`, canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText("PRESS [R] TO REBOOT AND RETRY", canvas.width / 2, canvas.height / 2 + 70);
    }

    // Processing Matrix Vector Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    updateUI();
    requestAnimationFrame(loop);
}

// Global initialization sequence
requestAnimationFrame(loop);
</script>
</body>
</html>
