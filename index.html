<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Zhenanigans (Normal Mode)</title>

<style>
body {
    margin: 0;
    background-color: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}

#ui {
    margin-bottom: 20px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
    width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
}

.hp-label { margin-right: 12px; }

#health-container {
    width: 200px;
    height: 20px;
    background-color: #444;
    border: 2px solid #555;
    border-radius: 3px;
    overflow: hidden;
}

#health-bar {
    width: 100%;
    height: 100%;
    background-color: #00ff66;
    transition: width 0.1s ease;
}

#game-container {
    position: relative;
    width: 800px;
    height: 600px;
}

canvas {
    background-color: #1a1a1a;
    border: 4px solid #333;
    cursor: crosshair;
    position: absolute;
}

#gameover {
    display: none;
    position: absolute;
    width: 100%;
    top: 40%;
    font-size: 48px;
    color: #ff3333;
    font-weight: bold;
    text-align: center;
}

#restart {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
    background: #ff3333;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
    <div>Zombie Zhenanigans (NORMAL)</div>
    <div>HP: <span id="hpText"></span></div>
    <div>Wave: <span id="wave"></span></div>
</div>

<div id="game-container">
<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="gameover">
GAME OVER
<br>
<button id="restart" onclick="resetGame()">Restart</button>
</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const hpText = document.getElementById("hpText");
const waveText = document.getElementById("wave");
const gameover = document.getElementById("gameover");

let player = {
    x: 400,
    y: 300,
    size: 20,
    speed: 4,
    hp: 100,
    maxHp: 100
};

let zombies = [];
let bullets = [];
let keys = {};
let mouse = {x:0,y:0};

let wave = 0;
let gameOver = false;

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener("mousemove", e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
});

canvas.addEventListener("mousedown", shoot);

function shoot(){
    if (gameOver) return;

    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    bullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle)*8,
        vy: Math.sin(angle)*8,
        size: 4,
        dmg: 1
    });
}

function spawnWave(){
    wave++;

    let zombieCount = Math.floor(wave * 1.2) + (wave > 1 ? 1 : 0);

    for(let i=0;i<zombieCount;i++){
        zombies.push({
            x: Math.random()*800,
            y: Math.random()*600,
            speed: 1.3 + wave*0.05,
            hp: 3 + Math.floor(wave/2),
            size: 16
        });
    }

    waveText.innerText = wave;
}

function update(){
    if (gameOver) return;

    if (keys["w"]) player.y -= player.speed;
    if (keys["s"]) player.y += player.speed;
    if (keys["a"]) player.x -= player.speed;
    if (keys["d"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(800, player.x));
    player.y = Math.max(0, Math.min(600, player.y));

    if (zombies.length === 0) spawnWave();

    zombies.forEach((z, zi) => {
        let dx = player.x - z.x;
        let dy = player.y - z.y;
        let dist = Math.hypot(dx, dy);

        z.x += (dx/dist) * z.speed;
        z.y += (dy/dist) * z.speed;

        if (dist < player.size + z.size) {
            player.hp -= 10;
            if (player.hp <= 0) {
                gameOver = true;
                gameover.style.display = "block";
            }
        }

        bullets.forEach((b, bi) => {
            let d = Math.hypot(b.x - z.x, b.y - z.y);
            if (d < z.size) {
                z.hp -= b.dmg;
                bullets.splice(bi,1);
            }
        });

        if (z.hp <= 0) zombies.splice(zi,1);
    });

    bullets.forEach((b, i) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 600) {
            bullets.splice(i,1);
        }
    });

    hpText.innerText = player.hp;
}

function draw(){
    ctx.clearRect(0,0,800,600);

    ctx.fillStyle = "#3388ff";
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#ffcc00";
    bullets.forEach(b=>{
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
        ctx.fill();
    });

    zombies.forEach(z=>{
        ctx.fillStyle = "#44aa44";
        ctx.beginPath();
        ctx.arc(z.x,z.y,z.size,0,Math.PI*2);
        ctx.fill();
    });
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

function resetGame(){
    player.hp = 100;
    zombies = [];
    bullets = [];
    wave = 0;
    gameOver = false;
    gameover.style.display = "none";
}

loop();
</script>

</body>
</html>
